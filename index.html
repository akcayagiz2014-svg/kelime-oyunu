// ---------- Depolama yardımcıları (Firebase Gerçek Zamanlı Veritabanı destekli paylaşılan durum) ----------
async fonksiyon loadShared(anahtar, yedek) {
  denemek {
    const snap = await window.__fbdb.ref(key).get();
    const val = snap.exists() ? snap.val() : null;
    (val !== null && val !== undefined) ? val : yedek değer döndür;
  } yakala (e) {
    console.error("loadShared(" + key + ") başarısız oldu", e);
    yedek seçeneği döndür;
  }
}
asenkron fonksiyon saveShared(anahtar, değer) {
  denemek {
    await window.__fbdb.ref(key).set(value);
  } yakala (e) {
    console.error("saveShared(" + key + ") başarısız oldu", e);
  }
}
// Canlı abonelik yardımcısı (sorgulama aralığını beklemek yerine anlık güncellemeler göndermek için kullanılır)
fonksiyon subscribeShared(key, cb) {
  const ref = window.__fbdb.ref(key);
  const handler = (snap) => cb(snap.exists() ? snap.val() : {});
  ref.on("value", handler);
  return () => ref.off("value", handler);
}

// Anahtar gerektirmeyen, CORS özellikli API (arka uç gerekmez).
// Her zaman İngilizce Wiktionary'yi (açık ara en kapsamlı sürüm) sorgular ve
// Sayfanın seçilen dil için bir bölüme sahip olup olmadığını kontrol eder —
// Aksi takdirde, örneğin Türkçe bir kelime İngilizce oynatılırken yanlışlıkla geçerli sayılır.
// Çünkü Wiktionary sayfaları birçok dildeki çevirileri listeliyor. ----------
const WIKT_LANG_HEADER = { en: "İngilizce", tr: "Türkçe", de: "Almanca" };

asenkron fonksiyon checkWordValid(kelime, dil, mustStartWith) {
  sabit w = kelime.kırpma();
  Eğer (w.length < 2) ise false döndür;
  const locale = lang === "tr" ? "tr-TR" : undefined;
  const wFirst = w[0].toLocaleUpperCase(locale);
  const reqUpper = mustStartWith.toLocaleUpperCase(locale);
  Eğer wFirst !== reqUpper ise false döndür; // yanlış başlangıç ​​harfi — ağa bağlanmaya gerek yok

  const headerName = WIKT_LANG_HEADER[lang] || "English";
  const headerRegex = new RegExp(`^==\\s*${headerName}\\s*==`, "m");
  const candidates = [w.toLocaleLowerCase(locale), w]; // çoğu giriş küçük harfli; ayrıca yazıldığı gibi deneyin

  (adayların sabit adayı için) {
    denemek {
      const url = `https://en.wiktionary.org/w/api.php?action=query&prop=revisions&titles=${encodeURIComponent(candidate)}&rvprop=content&rvslots=main&formatversion=2&format=json&origin=*`;
      const res = await fetch(url);
      const data = await res.json();
      const pages = (data && data.query && data.query.pages) || [];
      (sabit sayfa sayısı için) {
        Eğer sayfa eksikse devam et;
        const rev = page.revisions && page.revisions[0];
        const content = rev ? (rev.content || (rev.slots && rev.slots.main && rev.slots.main.content) || "") : "";
        Eğer içerik && headerRegex.test(content) ise true döndür; // Onaylandı: Bu sayfada seçilen dil için özel bir bölüm var
      }
    } yakala (e) {
      console.error("sözlük araması başarısız oldu", e);
      // Ağda aksaklık: Bu adayda kesin başarısızlık kararı vermeyin, bir sonrakini deneyin / devam edin
    }
  }
  false döndür;
}

fonksiyon sonharf(kelime, dil) {
  sabit w = kelime.kırpma();
  if (!w) return "";
  // Türkçe noktalı/noktasız i harflerini, yalnızca son Unicode karakterini alarak doğru şekilde ele alın.
  return w[w.length - 1].toLocaleUpperCase(lang === "tr" ? "tr-TR" : undefined);
}
fonksiyon ilkHarf(kelime, dil) {
  sabit w = kelime.kırpma();
  if (!w) return "";
  return w[0].toLocaleUpperCase(lang === "tr" ? "tr-TR" : undefined);
}
// İki kelimeyi tam (büyük/küçük harf duyarsız) eşitlik açısından karşılaştırmak için kullanılan normalleştirilmiş biçim,
// Bu nedenle "Kedi" ve "kedi" aynı tur içinde aynı kelime olarak sayılır.
fonksiyon normalizeWord(kelime, dil) {
  sabit w = (kelime || "").trim();
  if (!w) return "";
  return w.toLocaleLowerCase(lang === "tr" ? "tr-TR" : undefined);
}

fonksiyon formatKalan(ms) {
  Eğer ms <= 0 ise "0:00" döndür;
  const totalSec = Math.floor(ms / 1000);
  sabit h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  sabit s = toplamSec % 60;
  Eğer h > 0 ise, `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` değerini döndür;
  `${m}:${String(s).padStart(2, "0")}` değerini döndür;
}

fonksiyon Tekerlek({ lang, spinning, resultLetter, onSpinEnd, size = 260, excludeFirst }) {
  const letters = ALPHABETS[lang].filter(l => (excludeFirst ? l !== excludeFirst : true));
  const [rotation, setRotation] = useState(0);
  const sliceAngle = 360 / letters.length;
  const prevSpinning = useRef(false);

  useEffect(() => {
    eğer (dönüyorsa ve önceki dönme hareketinin geçerli olduğu yer değilse ve sonuç harfi ise) {
      const idx = letters.indexOf(resultLetter);
      const targetIdx = idx >= 0 ? idx : 0;
      // Dilim merkezini üst işaretçiye (0 derece) getirmek için açı
      const sliceCenter = targetIdx * sliceAngle + sliceAngle / 2;
      sabit hedef = (360 - dilimmerkezi + 360) % 360;
      setRotation(r => {
        sabit currentMod = ((r % 360) + 360) % 360;
        sabit delta = ((hedef - mevcutMod) + 360) % 360;
        r + 360 * 6 + delta değerini döndür;
      });
    }
    prevSpinning.current = spinning;
  }, [dönme, sonuç harfi]); // eslint-satırı devre dışı bırak

  geri dönmek (
    <div className="relative select-none" style={{ width: size, height: size }}>

        sınıf adı="mutlak sol-1/2 -üst-3 z-20"

      />
      <div
        sınıf adı="mutlak içe doğru yuvarlanmış-tam"
        stil={{
          dönüştürme: `döndürme(${döndürme}derece)`,
          geçiş: dönme ? "transform 3.2s cubic-bezier(.17,.67,.14,1)" : "none",
          boxShadow: "0 0 0 6px #3a2265, 0 0 0 10px #f2b70555, 0 20px 50px rgba(0,0,0,.55)",
        }}
        onTransitionEnd={() => { if (spinning) onSpinEnd && onSpinEnd(); }}
      >
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <circle cx="100" cy="100" r="99" fill="#241542" />
          {harfler.map((l, i) => {
            sabit a0 = (i * sliceAngle - 90) * (Math.PI / 180);
            sabit a1 = ((i + 1) * sliceAngle - 90) * (Math.PI / 180);
            const x0 = 100 + 99 * Math.cos(a0), y0 = 100 + 99 * Math.sin(a0);
            const x1 = 100 + 99 * Math.cos(a1), y1 = 100 + 99 * Math.sin(a1);
            sabit büyük = dilim açısı > 180 ? 1 : 0;
            sabit mid = (a0 + a1) / 2;
            const lx = 100 + 68 * Math.cos(mid), ly = 100 + 68 * Math.sin(mid);
            const fill = i % 2 === 0 ? "#2c1750" : "#33204f";
            geri dönmek (
              <g key={l}>
                <path d={`M100,100 L${x0},${y0} A99,99 0 ${large} 1 ${x1},${y1} Z`} fill={fill} stroke="#4a2f7a" strokeWidth="1" />
                <text x={lx} y={ly} fill="#f5f0ff" fontSize="11" fontWeight="700" textAnchor="middle" dominantBaseline="middle"
                  transform={`rotate(${(mid * 180 / Math.PI) + 90}, ${lx}, ${ly})`}>{l}</text>
              </g>
            );
          })}
          <circle cx="100" cy="100" r="16" fill="#f2b705" stroke="#3a2265" strokeWidth="3" />

}

fonksiyon App() {
  const [lang, setLang] = useState("tr");
  sabit t = T[lang];
  const [screen, setScreen] = useState("auth"); // kimlik doğrulama, menü, gruplar, sohbet, lobi, oyun, tek oyunculu, liderlik tablosu, bildirimler, yönetici
  const [authMode, setAuthMode] = useState("login");
  const [authForm, setAuthForm] = useState({ username: "", password: "" });
  const [authError, setAuthError] = useState("");
  const [me, setMe] = useState(null); // {kullanıcı adı, yönetici mi, puan, madalyalar}
  const [googleAdminVerified, setGoogleAdminVerified] = useState(false);
  const [googleAdminEmail, setGoogleAdminEmail] = useState(null);
  const [googleAdminBusy, setGoogleAdminBusy] = useState(false);
  const [googleAdminError, setGoogleAdminError] = useState("");
  const [users, setUsers] = useState({});
  const [gruplar, setGroups] = useState({});
  const [activeGroupId, setActiveGroupId] = useState(null);
  const [activeGameId, setActiveGameId] = useState(null);
  const [games, setGames] = useState({});
  const [showCreateGroup, setShowCreateGroup] = useState(false);
  const [yeniGrupAdı, setYeniGrupAdı] = useState("");
  const [showGroupInvite, setShowGroupInvite] = useState(false);
  const [groupInviteSearch, setGroupInviteSearch] = useState("");
  const [showMedalInfo, setShowMedalInfo] = useState(false);
  const [adminSpectateGameId, setAdminSpectateGameId] = useState(null);
  const [medalPopup, setMedalPopup] = useState(null);
  const [pointInputs, setPointInputs] = useState({}); // Yönetici paneli: kullanıcı adı -> girilen puan miktarı
  const [tick, setTick] = useState(Date.now());
  useEffect(() => {
    const iv = setInterval(() => setTick(Date.now()), 1000);
    return () => clearInterval(iv);
  }, []);

  // ---- Süresi dolmuş grup temizliği: Gruplar oluşturulduktan 1 saat sonra otomatik olarak silinir, aksi belirtilmedikçe.
  // Bu dosyalarda aktif olarak bir tur oynanıyorsa, silme işlemi bekler.
  // o tur "sonuçlar" aşamasına ulaşana kadar ----
  fonksiyon cleanExpiredGroups(groupsObj, gamesObj) {
    const now = Date.now();
    GruplarDeğişti = false olsun;
    const nextGroups = { ...groupsObj };
    for (const [id, g] of Object.entries(groupsObj)) {
      if (!g.expiresAt) continue; // Bu özellikten önce oluşturulan eski gruplar: asla otomatik olarak sona ermez
      const activeGame = Object.values(gamesObj).find(gm2 => gm2.groupId === id && (gm2.status === "playing" || gm2.status === "spinning"));
      if (now >= g.expiresAt) {
        eğer (aktifOyun) {
          Eğer (g.silinme bekliyorsa) { nextGroups[id] = { ...g, pendingDelete: true }; groupsChanged = true; }
        } başka {
          nextGroups[id]'yi sil;
          GruplarDeğişti = doğru;
        }
      }
    }
    let gamesChanged = false;
    const nextGames = { ...gamesObj };
    for (const [gid, game] of Object.entries(gamesObj)) {
      Eğer (!nextGroups[game.groupId]) bir sonraki oyunu grup kimliğinden sil; gamesChanged = true; }
    }
    return { groups: nextGroups, games: nextGames, groupsChanged, gamesChanged };
  }

  // ---- İlk yükleme (tek seferlik yenileme olarak da yeniden kullanılabilir, örneğin kimlik doğrulamasından hemen sonra) ----
  const refreshAll = useCallback(async () => {
    const [u, g0, gm0] = await Promise.all([
      loadShared("users", {}),
      loadShared("gruplar", {}),
      loadShared("games", {}),
    ]);
    const { groups: g, games: gm, groupsChanged, gamesChanged } = cleanExpiredGroups(g0, gm0);
    Eğer gruplar değiştiyse, saveShared("groups", g) fonksiyonunu çağırın.
    Eğer oyunlar değiştiyse, saveShared("games", gm) fonksiyonunu çağırın.
    Kullanıcıları ayarla(u); Grupları ayarla(g); Oyunları ayarla(gm);
    { u, g, gm } döndür;
  }, []);

  useEffect(() => { refreshAll(); }, [refreshAll]);

  // ---- canlı senkronizasyon: Firebase Gerçek Zamanlı Veritabanı değişiklikleri her yere gönderir
  // Bağlantı anında kuruluyor, bu nedenle artık belirli aralıklarla sorgulama yapmaya gerek yok ----
  useEffect(() => {
    const unsubUsers = subscribeShared("users", setUsers);
    const unsubGroups = subscribeShared("groups", setGroups);
    const unsubGames = subscribeShared("games", setGames);
    return () => { unsubUsers(); unsubGroups(); unsubGames(); };
  }, []);

  // ---- Süre sonu taraması: Grup süre sonu zaman bazlıdır (herhangi bir veri tarafından tetiklenmez).
  // değişiklik), bu nedenle hala kendi hafif periyodik kontrolüne ihtiyaç duyuyor ----
  const groupsRef = useRef(groups);
  const gamesRef = useRef(games);
  useEffect(() => { groupsRef.current = groups; }, [groups]);
  useEffect(() => { gamesRef.current = games; }, [games]);
  useEffect(() => {
    sabit iv = setInterval(async () => {
      const { groups: g, games: gm, groupsChanged, gamesChanged } = cleanExpiredGroups(groupsRef.current, gamesRef.current);
      Eğer gruplar değiştiyse, saveShared("groups", g) fonksiyonunu çağırın.
      Eğer oyunlar değiştiyse, saveShared("games", gm) fonksiyonunu çağırın.
    }, 5000);
    return () => clearInterval(iv);
  }, []);

  // `me`'yi en son kullanıcılar veri tabanıyla senkronize tutun (puan güncellemeleri için başka yerlerde kullanılabilir).
  useEffect(() => {
    eğer (ben ve kullanıcılar[ben.kullanıcı adı]) {
      const fresh = users[me.username];
      const newMedals = medalsForScore(fresh.score);
      if (newMedals.length > (me.medals || []).length) {
        const justEarned = newMedals[newMedals.length - 1];
        const tier = MEDAL_TIERS.find(m => m.key === justEarned);
        setMedalPopup(tier);
      }
      setMe({ username: me.username, isAdmin: fresh.isAdmin, score: fresh.score, medals: newMedals });
    }
  }, [kullanıcılar]); // eslint-disable-line

  // ---- Cihazda otomatik oturum açma: Kullanıcı bu cihazda başarılı bir şekilde oturum açtıktan sonra
  // Cihaz/tarayıcı, bu cihazın "tanınması" için bunları burada saklayın ve
  // Artık Google adımını veya kullanıcı adı/şifre formunu görmenize gerek yok ----
  useEffect(() => {
    const saved = localStorage.getItem("kt_device_login");
    Kaydedilmemişse geri dön;
    (asenkron () => {
      denemek {
        const { username: savedUsername, password: savedPassword, isAdmin: savedIsAdmin } = JSON.parse(saved);
        const u = await loadShared("users", {});
        const rec = u[savedUsername];
        if (rec && rec.password === savedPassword) {
          setGoogleAdminVerified(true);
          setGoogleAdminEmail(savedIsAdmin ? ADMIN_GOOGLE_EMAIL.toLowerCase() : null);
          setMe({ username: savedUsername, isAdmin: rec.isAdmin, score: rec.score || 0, medals: medalsForScore(rec.score || 0) });
          setScreen("menü");
        } başka {
          localStorage.removeItem("kt_device_login");
        }
      } yakala (e) {
        localStorage.removeItem("kt_device_login");
      }
    })();
  }, []);

  // ---------------- DOTH ----------------
  // Google ile oturum açma artık HER kullanıcı için zorunlu ilk güvenlik adımıdır.
  // Sadece yöneticiler değil. Herkes herhangi bir Google hesabıyla buradan giriş yapabilir —
  // Bu adım tek başına yönetici erişimi sağlamaz. Bu işlem başarılı olduktan sonra,
  // normal rumuz (kullanıcı adı) + şifre (şifre) giriş/kayıt akışı
  // Önceki gibi devam eder. Yalnızca burada kullanılan Google hesabı şu ise:
  // Sonuç olarak ortaya çıkan hesap tam olarak hangi ADMIN_GOOGLE_EMAIL adresine yönetici yetkisi alır?
  // Panel düğmesi — hangi kullanıcı adı/şifre kullanılmış olursa olsun.
  asenkron fonksiyon handleGoogleAdminVerify() {
    setGoogleAdminError("");
    setGoogleAdminBusy(true);
    denemek {
      const result = await window.__fbauth.signInWithPopup(window.__googleProvider);
      const email = (result.user && result.user.email || "").toLowerCase();
      setGoogleAdminVerified(true);
      setGoogleAdminEmail(email);
    } yakala (e) {
      console.error("Google oturum açma başarısız oldu", e);
      setGoogleAdminError(t.googleAdminFailed);
    }
    setGoogleAdminBusy(false);
  }

  asenkron fonksiyon handleAuth() {
    setAuthError("");
    const uname = authForm.username.trim();
    const pass = authForm.password;
    Eğer uname yoksa veya pass değeri girilmemişse, t.fillFields değişkenine bir kimlik doğrulama hatası (setAuthError) ekleyin ve işlemi sonlandırın.
    // Güvenlik önlemi: Kullanıcı arayüzü, Google oturum açma işlemi tamamlanana kadar bu formu zaten gizliyor.
    // Tamamlandı, ancak burada da tekrar kontrol edin.
    Eğer GoogleAdmin doğrulanmadıysa, t.googleAdminRequired'ı ayarlayarak işlemi durdurun.
    const isAdminGoogle = (googleAdminEmail || "") === ADMIN_GOOGLE_EMAIL.toLowerCase();
    const { u } = await refreshAll();
    if (authMode === "login") {
      sabit rec = u[uname];
      Eğer rec doğru değilse veya rec.password doğru değilse, t.wrongLogin için setAuthError hatası oluşturup işlemi durdurun.
      // Yönetici paneli görünürlüğü tamamen hangi Google hesabının kullanıldığına bağlıdır.
      // Yukarıda kullanıldığı için, her zaman mevcut Google kimliğine yeniden senkronize ediyoruz.
      const nu = { ...u, [uname]: { ...rec, isAdmin: isAdminGoogle } };
      wait saveShared("kullanıcılar", nu); setUsers(nu);
      setMe({ username: uname, isAdmin: isAdminGoogle, score: rec.score || 0, medals: medalsForScore(rec.score || 0) });
      localStorage.setItem("kt_device_login", JSON.stringify({ username: uname, password: pass, isAdmin: isAdminGoogle }));
      setScreen("menü");
    } başka {
      if (u[uname]) { setAuthError(t.userExists); return; }
      const rec = { password: pass, score: 0, isAdmin: isAdminGoogle };
      const nu = { ...u, [uname]: rec };
      wait saveShared("kullanıcılar", nu); setUsers(nu);
      setMe({ username: uname, isAdmin: isAdminGoogle, score: 0, medals: [] });
      localStorage.setItem("kt_device_login", JSON.stringify({ username: uname, password: pass, isAdmin: isAdminGoogle }));
      setScreen("menü");
    }
  }

  fonksiyon çıkış yap() {
    setMe(null); setScreen("auth"); setAuthForm({ username: "", password: "" });
    setGoogleAdminVerified(false); setGoogleAdminEmail(null); setGoogleAdminError("");
    localStorage.removeItem("kt_device_login");
    if (window.__fbauth.currentUser) window.__fbauth.signOut().catch(() => {});

  asenkron fonksiyon adjustScore(kullanıcı adı, delta) {

    Eğer grup sayımı 50'den büyük veya eşitse, "grup limitine ulaşıldı" uyarısını verip işlemi sonlandırın.

    const today = new Date().toISOString().slice(0, 10);
    const freshUsers = await loadShared("users", {});
    const myRec = freshUsers[me.username] || { password: "", score: 0, isAdmin: false };
    const countToday = myRec.groupsCreatedDate === today ? (myRec.groupsCreatedCount || 0) : 0;
    Eğer (countToday >= 3) ise, t.dailyGroupLimit'e uyarı gönder ve işlemi sonlandır.

    sabit id = uid();
    const now = Date.now();
    const g = { id, name: newGroupName.trim(), owner: me.username, members: [me.username], messages: [], createdAt: now, expiresAt: now + 2 * 60 * 60 * 1000, pendingDelete: false };
    const ng = { ...gruplar, [id]: g };
    wait saveShared("gruplar", ng); setGroups(ng);

    const nu = { ...freshUsers, [me.username]: { ...myRec, groupsCreatedDate: today, groupsCreatedCount: countToday + 1 } };
    wait saveShared("kullanıcılar", nu); setUsers(nu);

    setNewGroupName(""); setShowCreateGroup(false);

      w => w.word && normalizeWord(w.word, game.lang) === normalizeWord(trimmed, game.lang)
    );
    eğer (aynı dosya ise) {
      // aynı kelime bu turda daha önce kullanılmış: oyun herkes için burada bitiyor
      oyun.kelimeZinciri.itme({ kullanıcıadı: ben.kullanıcıadı, kelime: kırpılmış, puanlar: 0 });
      oyun.durumu = "oyun bitti";
      oyun.oyunBitirmeSözü = kırpılmış;
      oyun.oyunbitti = ben.kullanıcıadı;
      await saveShared("games", gm); setGames(gm);
      geri dönmek;
    }

    const points = isValid && trimmed ? POINTS_PER_WORD : 0;
    oyun.kelimeZinciri.itme({ kullanıcıadı: ben.kullanıcıadı, kelime: kırpılmış, puanlar });
    Eğer puan sayısı 0'dan büyükse, kullanıcı adınıza ve kelime başına puanlarınıza puan eklemek için bir bekleme işlemi gerçekleştirin.
    if (game.wordChain.length >= ROUND_WORD_LIMIT) {
      oyun.durum = "sonuçlar";

        for (sabit m of game.members) {

    }
    await saveShared("games", gm); setGames(gm);
  }

            <div className="w-16 h-16 rounded-2xl flex items-center justify-center flex-shrink-0 relative" style={{ background: "linear-gradient(135deg,#f2b705,#ff8a3d)", boxShadow: "0 8px 22px rgba(242,183,5,0.35)" }}>
              <span className="text-2xl font-black" style={{ fontFamily: "Fredoka, sans-serif", color: "#1b1030" }}>
                {me.username.slice(0, 1).toLocaleUpperCase(lang === "tr" ? "tr-TR" : undefined)}
              </span>
              {ben.yöneticiyim && (
                <div className="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full flex items-center justify-center" style={{ background: "#2c1750", border: "2px solid #1b1030" }}>
                  <Shield size={11} color="#c9a8ff" />
                </div>
              )}
            </div>
            <div className="flex-1 min-w-0">
              <p className="text-white font-bold text-lg truncate" style={{ fontFamily: "Fredoka, sans-serif" }}>{me.username}</p>
              <div className="flex items-center gap-3 mt-1 flex-wrap">
                <span className="flex items-center gap-1 text-yellow-400 font-bold text-sm"><Trophy size={13} />{me.score}</span>
                {myRank > 0 && <span className="text-white/35 text-xs font-semibold">#{myRank} {t.worldRank}</span>}
              </div>
            </div>
          </div>

          <div onClick={() => setShowMedalInfo(true)} className="cursor-pointer">
            {me.medals.length > 0 && (
              <div className="flex items-center gap-2 mt-4 flex-wrap">
                {me.medals.map(mk => {
                  const tier = MEDAL_TIERS.find(x => x.key === mk); const Icon = tier.icon;
                  geri dönmek (
                    <div key={mk} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: `${tier.color}22`, border: `1px solid ${tier.color}55` }}>
                      <Icon size={16} color={tier.color} />
                    </div>
                  );
                })}
              </div>
            )}

            {sonrakiKademe && (
              <div className="mt-4">
                <div className="flex justify-between text-[10px] text-white/40 mb-1.5 font-semibold">
                  <span>{t.nextMedal}: {nextTier.label[lang]}</span>
                  <span>{me.score}/{nextTier.threshold}</span>
                </div>
                <div className="h-1.5 rounded-full bg-white/10 overflow-hidden">
                  <div className="h-full rounded-full transition-all" style={{ width: `${progressPct}%`, background: nextTier.color }} />
              </div>
            </div>
          )}
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3 max-w-md mx-auto">
          <button onClick={() => setScreen("groups")} className="col-span-2 flex items-center justify-center gap-2 py-5 rounded-2xl font-bold text-lg" style={{ background: "linear-gradient(135deg,#f2b705,#ff8a3d)", color: "#1b1030", fontFamily: "Fredoka, sans-serif" }}>
            <Kullanıcılar size={22} /> {t.myGroups} ({myGroups.length})
          </button>
          <button onClick={() => setScreen("solo")} className="flex flex-col items-center justify-center gap-2 py-6 rounded-2xl bg-white/10 text-white font-semibold hover:bg-white/20">
            <Play size={26} /> {t.soloPlay}
          </button>
          <button onClick={() => setScreen("leaderboard")} className="flex flex-col items-center justify-center gap-2 py-6 rounded-2xl bg-white/10 text-white font-semibold hover:bg-white/20">
            <Kupa boyutu={26} /> {t.liderboard}
          </button>
          {me.isAdmin && googleAdminVerified && (
            <button onClick={() => setScreen("admin")} className="col-span-2 flex items-center justify-center gap-2 py-4 rounded-2xl bg-purple-900/50 border border-purple-400/30 text-purple-200 font-semibold hover:bg-purple-900/70">
              <Shield size={20} /> {t.admin}
            </button>
          )}
        </div>

        <div className="fixed bottom-6 left-0 right-0 flex justify-center gap-3">
          <button onClick={() => setScreen("notifications")} className="flex items-center gap-2 px-5 py-3 rounded-full bg-black/40 backdrop-blur text-white font-semibold border border-white/10">
            <Bell size={18} /> {t.notifications}
          </button>
          <button onClick={logout} className="flex items-center gap-2 px-5 py-3 rounded-full bg-black/40 backdrop-blur text-white/70 font-semibold border border-white/10">
            <LogOut size={18} /> {t.logout}
          </button>
        </div>

        {showCreateGroup && (
          <Modal onClose={() => setShowCreateGroup(false)}>
            <h3 className="text-white font-bold mb-3" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.createGroup}</h3>
            <input value={newGroupName} onChange={e => setNewGroupName(e.target.value)} placeholder={t.groupName}
              className="w-full px-4 py-3 rounded-xl bg-white/10 text-white placeholder-white/40 outline-none mb-3" />
            <div className="flex gap-2">
              <button onClick={() => setShowCreateGroup(false)} className="flex-1 py-2.5 rounded-xl bg-white/10 text-white">{t.cancel}</button>
              <button onClick={createGroup} className="flex-1 py-2.5 rounded-xl font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>{t.create}</button>
            </div>
          </Modal>
        )}
        {medalPopup && <MedalPopup tier={medalPopup} t={t} onClose={() => setMedalPopup(null)} />}
        {showMedalInfo && (
          <Modal onClose={() => setShowMedalInfo(false)}>
            <h3 className="text-white font-bold mb-1" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.medals}</h3>
            <p className="text-white/40 text-xs mb-4">{t.score}: <span className="text-yellow-400 font-bold">{me.score}</span></p>
            <div className="space-y-2">
              {MEDAL_TIERS.map(tier => {
                const Icon = tier.icon;
                const earned = me.score >= tier.threshold;
                geri dönmek (
                  <div key={tier.key} className="flex items-center justify-between px-3 py-2.5 rounded-xl"
                    style={{ background: earned ? `${tier.color}1a` : "rgba(255,255,255,0.05)", border: `1px solid ${earned ? tier.color + "66" : "rgba(255,255,255,0.08)"}` }}>
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: `${tier.color}22` }}>
                        <Icon size={16} color={tier.color} />
                      </div>
                      <span className={`font-semibold text-sm ${earned ? "text-white" : "text-white/50"}`}>{tier.label[lang]}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold" style={{ color: earned ? tier.col or : "rgba(255,255,255,0.4)" }}>{tier.threshold.toLocaleString(lang === "tr" ? "tr-TR" : undefined)}</span>
                      {kazanılan && <Check size={14} color={tier.color} />}
                    </div>
                  </div>
                );
              })}
            </div>
            <button onClick={() => setShowMedalInfo(false)} className="w-full mt-4 py-2.5 rounded-xl bg-white/10 text-white">{t.close}</button>
          </Modal>
        )}
      </div>
    );
  }

  // ---------------- GRUPLAR LİSTESİ ----------------
  if (screen === "groups") {
    geri dönmek (
      <div className="min-h-screen w-full p-5" style={{ fontFamily: "Inter, sans-serif" }}>
        {bg}
        {Başlık(t.myGroups)}
        <button onClick={() => setShowCreateGroup(true)} className="mb-4 flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 text-white text-sm font-semibold hover:bg-white/20">
          <Plus size={16} /> {t.createGroup}
        </button>
        {myGroups.length === 0 && <p className="text-white/50 text-center mt-10">{t.noGroups}</p>}
        <div className="space-y-2 max-w-md mx-auto">
          {myGroups.map(g => {
            const remaining = g.expiresAt ? g.expiresAt - tick : null;
            geri dönmek (
              <button key={g.id} onClick={() => { setActiveGroupId(g.id); setScreen("chat"); }}
                className="w-full flex items-center justify-between px-4 py-4 rounded-2xl bg-white/10 hover:bg-white/20 text-left">
                <div>
                  <p className="text-white font-semibold">{g.name}</p>
                  <p className="text-white/50 text-xs">{g.members.length} {t.members}</p>
                </div>
                <div className="flex flex-col items-end gap-1">
                  <Swords size={18} className="text-white/40" />
                  {kalan != null && (
                    <span className="flex items-center gap-1 text-[10px] font-semibold" style={{ color: remaining <= 0 ? "#ff8a8a" : remaining < 5 * 60 * 1000 ? "#ffb84d" : "rgba(255,255,255,0.35)" }}>
                      <Clock size={9} /> {remaining > 0 ? formatRemaining(remaining) : g.pendingDelete ? t.closesInGame : "0:00"}
                    </span>
                  )}
                </div>
              </button>
            );
          })}
        </div>
        <button onClick={() => setScreen("menu")} className="fixed bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-2 px-6 py-3 rounded-full bg-black/40 backdrop-blur text-white font-semibold border border-white/10">
          <ArrowLeft size={16} /> {t.back}
        </button>
        {showCreateGroup && (
          <Modal onClose={() => setShowCreateGroup(false)}>
            <h3 className="text-white font-bold mb-3">{t.createGroup}</h3>
            <input value={newGroupName} onChange={e => setNewGroupName(e.target.value)} placeholder={t.groupName}
              className="w-full px-4 py-3 rounded-xl bg-white/10 text-white placeholder-white/40 outline-none mb-3" />
            <div className="flex gap-2">
              <button onClick={() => setShowCreateGroup(false)} className="flex-1 py-2.5 rounded-xl bg-white/10 text-white">{t.cancel}</button>
              <button onClick={createGroup} className="flex-1 py-2.5 rounded-xl font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>{t.create}</button>
            </div>
          </Modal>
        )}
      </div>
    );
  }

  // ---------------- SOHBET ----------------
  if (screen === "chat" && activeGroupId) {
    sabit grp = gruplar[aktifgrup kimliği];
    eğer (!grp) {
      return <GoneScreen bg={bg} message={t.groupGone} backLabel={t.back} onBack={() => setScreen("groups")} />;
    }
    const remaining = grp.expiresAt ? grp.expiresAt - tick : null;
    const isOwner = grp.owner === me.username;
    const filteredUsers = Object.keys(users).filter(u => u !== me.username && u.toLocaleLowerCase(lang === "tr" ? "tr-TR" : undefined).includes(groupInviteSearch.trim().toLocaleLowerCase(lang === "tr" ? "tr-TR" : undefined)));
    geri dönmek (
      <div className="min-h-screen w-full p-5 flex flex-col" style={{ fontFamily: "Inter, sans-serif" }}>
        {bg}
        {isOwner ? (
          <div className="max-w-md w-full mx-auto mb-2 flex justify-center gap-2">
            <button onClick={() => { setGroupInviteSearch(""); setShowGroupInvite(true); }}
              className="flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold" style={{ background: "#2c1750", border: "1px solid rgba(255,255,255,0.15)", color: "#f5f0ff" }}>
              <Kullanıcılar size={14} /> {t.groupCallBtn}
            </button>
            <button onClick={() => { if (window.confirm(t.deleteGroupConfirm)) deleteGroupFn(activeGroupId); }}
              className="flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold bg-red-500/80 text-white">
              <X size={14} /> {t.deleteGroup}
            </button>
          </div>
        ) : (
          <div className="max-w-md w-full mx-auto mb-2 flex justify-center">
            <button onClick={() => { if (window.confirm(t.leaveGroupConfirm)) leaveGroupFn(activeGroupId); }}
              className="flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold bg-red-500/80 text-white">
              <LogOut size={14} /> {t.leaveGroup}
            </button>
          </div>
        )}
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2">
            <button onClick={() => setScreen("groups")} className="p-2 rounded-full bg-white/10 text-white"><ArrowLeft size={18} /></button>
            <div>
              <p className="text-white font-bold">{grp.name}</p>
              <p className="text-white/40 text-xs">{grp.members.length} {t.members}</p>
            </div>
          </div>
          <div className="flex flex-col items-end gap-1">
            <button onClick={() => sendGameInvite(activeGroupId)} className="flex items-center gap-1 px-3 py-2 rounded-full text-xs font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>
              <Swords size={14} /> {t.sendRequest}
            </button>
            {kalan != null && (
              <span className="flex items-center gap-1 text-[10px] font-semibold" style={{ color: remaining <= 0 ? "#ff8a8a" : remaining < 5 * 60 * 1000 ? "#ffb84d" : "rgba(255,255,255,0.4)" }}>
                <Clock size={10} /> {remaining > 0 ? formatRemaining(remaining) : grp.pendingDelete ? t.closesInGame : "0:00"}
              </span>
            )}
          </div>
        </div>

        <div className="max-w-md w-full mx-auto flex flex-wrap gap-1.5 mb-3">
          {grp.members.map(m => (
            <span key={m} className="flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-white/10 text-white">
              {m === grp.owner && <Crown size={10} color="#f2b705" />} {m}
              {isOwner && m !== grp.owner && (
                <button onClick={() => { if (window.confirm(`${m} ${t.kickConfirm}`)) kickFromGroup(activeGroupId, m); }}
                  className="ml-0.5 w-4 h-4 rounded-full flex items-center justify-center bg-red-500/70 hover:bg-red-500 text-white" title={t.kickMember}>
                  <X size={9} />
                </button>
              )}
            </span>
          ))}
        </div>

        <div className="flex-1 space-y-2 overflow-y-auto mb-3 max-w-md w-full mx-auto" style={{ maxHeight: "60vh" }}>
          {(grp.messages || []).map(m => (
            <div key={m.id} className={`max-w-[80%] ${m.from === me.username ? "ml-auto" : ""}`}>
              {m.type === "text" ? (
                <div className={`px-4 py-2 rounded-2xl text-sm ${m.from === me.username ? "bg-yellow-500 text-[#1b1030]" : "bg-white/10 text-white"}`}>
                  <p className="text-[10px] opacity-60 font-semibold">{m.from === me.username ? t.you : m.from}</p>
                  {m.text}
                </div>
              ) : (
                <button onClick={() => joinLobby(m.gameId)} className="w-full px-4 py-3 rounded-2xl text-left border-2 border-dashed border-yellow-400/60 bg-yellow-400/10 hover:bg-yellow-400/20">
                  <p className="text-yellow-300 text-xs font-bold flex items-center gap-1"><Swords size={14} /> {m.from} {t.gameInviteText}</p>
                </button>
              )}
            </div>
          ))}
          {(grp.messages || []).length === 0 && <p className="text-white/40 text-center text-sm mt-8">…</p>}
        </div>

        <div className="max-w-md w-full mx-auto flex gap-2">
          <input value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyDown={e => e.key === "Enter" && sendMessage(activeGroupId)}
            placeholder={t.writeMessage} className="flex-1 px-4 py-3 rounded-full bg-white/10 text-white placeholder-white/40 outline-none" />
          <button onClick={() => sendMessage(activeGroupId)} className="p-3 rounded-full" style={{ background: "#f2b705" }}><Send size={18} color="#1b1030" /></button>
        </div>

        {showGroupInvite && isOwner && (
          <Modal onClose={() => setShowGroupInvite(false)}>
            <h3 className="text-white font-bold mb-3" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.groupCallBtn}</h3>
            <input value={groupInviteSearch} onChange={e => setGroupInviteSearch(e.target.value)} placeholder={t.searchUser}
              className="w-full px-4 py-3 rounded-xl bg-white/10 text-white placeholder-white/40 outline-none mb-3" autoFocus />
            <div className="space-y-1.5 overflow-y-auto" style={{ maxHeight: "50vh" }}>
              {filteredUsers.length === 0 && <p className="text-white/40 text-sm text-center py-4">{t.noUserFound}</p>}
              {filtrelenmişKullanıcılar.harita(u => {
                const already = grp.members.includes(u);
                geri dönmek (
                  <div key={u} className="flex items-center justify-between px-3 py-2.5 rounded-xl bg-white/10">
                    <span className="text-white text-sm font-semibold">{u}</span>
                    <button disabled={already} onClick={() => inviteToGroup(activeGroupId, u)}
                      className="px-3 py-1.5 rounded-full text-xs font-bold disabled:opacity-40"
                      stil={{ arka plan: zaten ? "rgba(255,255,255,0.1)" : "#f2b705", renk: zaten ? "#fff" : "#1b1030" }}>
                      {Zaten mi? t.ZatenÜye : t.DavetEdildi}
                    </button>
                  </div>
                );
              })}
            </div>
            <button onClick={() => setShowGroupInvite(false)} className="w-full mt-3 py-2.5 rounded-xl bg-white/10 text-white">{t.close}</button>
          </Modal>
        )}
      </div>
    );
  }

  // ---------------- LOBİ ----------------
  if (screen === "lobby" && activeGameId) {
    sabit oyun = oyunlar[aktifOyunKimliği];
    eğer (!oyun) {
      return <GoneScreen bg={bg} message={t.groupGone} backLabel={t.back} onBack={() => setScreen("groups")} />;
    }
    if (game.status !== "lobby") {
      return <GroupGameView game={game} me={me} t={t} onSpinEnd={() => finishSpin(activeGameId)}
        onSubmitWord={(w, ok, timedOut) => submitWord(activeGameId, w, ok, timedOut)}
        onNextRound={() => backToWheelScreen(activeGameId)}
        onExitToChat={() => setScreen("chat")} onGameOver={() => setScreen("menu")} lang={game.lang} />;
    }
    const isHost = game.host === me.username;
    const canLeave = game.members.length > 1;
    geri dönmek (
      <div className="min-h-screen w-full p-5 flex flex-col items-center" style={{ fontFamily: "Inter, sans-serif" }}>
        {bg}
        {canLeave && (
          <button onClick={() => leaveLobby(activeGameId)} className="absolute top-5 left-1/2 -translate-x-1/2 flex items-center gap-1 px-4 py-2 rounded-full bg-red-500/80 text-white text-xs font-bold">
            <X size={14} /> {t.leaveLobby}
          </button>
        )}
        <div className="mt-16 text-center mb-6">
          <h2 className="text-xl font-bold text-white" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.lobi}</h2>
          <p className="text-white/50 text-sm">{game.members.length}/{game.maxMembers} · {t.waitingPlayers}</p>
        </div>
        <div className="flex flex-wrap gap-2 justify-center max-w-md mb-8">
          {game.members.map(m => (
            <div key={m} className="px-3 py-2 rounded-full bg-white/10 text-white text-sm flex items-center gap-1">
              {m === game.host && <Crown size={12} color="#f2b705" />} {m}
            </div>
          ))}
        </div>
        {isHost && (
          <button onClick={() => startSpin(activeGameId)} className="px-8 py-4 rounded-full font-bold text-lg flex items-center gap-2" style={{ background: "#f2b705", color: "#1b1030", fontFamily: "Fredoka, sans-serif" }}>
            <Play size={20} /> {t.startGame}
          </button>
        )}
        {!isHost && <p className="text-white/40 text-sm">{t.waitingPlayers}...</p>}
      </div>
    );
  }

  // ---------------- YALNIZ ----------------
  if (screen === "solo") {
    return <SoloGameView t={t} lang={lang} me={me} onAddPoints={(d) => addPoints(me.username, d)} onExit={() => setScreen("menu")} />;
  }

  // ---------------- LİDERLİK TABLOSU ----------------
  if (screen === "leaderboard") {
    const sorted = Object.entries(users).sort((a, b) => (b[1].score || 0) - (a[1].score || 0));
    geri dönmek (
      <div className="min-h-screen w-full p-5" style={{ fontFamily: "Inter, sans-serif" }}>
        {bg}
        {Başlık(t.dünyaLiderlikSırası, true)}
        <div className="max-w-md mx-auto space-y-2">
          {sorted.map(([name, rec], i) => {
            const mkeys = medalsForScore(rec.score || 0);
            geri dönmek (
              <div key={name} className="flex items-center justify-between px-4 py-3 rounded-2xl bg-white/10">
                <div className="flex items-center gap-3">
                  <span className="w-6 text-center font-bold" style={{ color: i === 0 ? "#f2b705" : i === 1 ? "#c9c9d6" : i === 2 ? "#c17a4a" : "#ffffff80" }}>{i + 1}</span>
                  <span className="text-white font-semibold">{name}</span>
                  {mkeys.map(mk => { const tier = MEDAL_TIERS.find(x => x.key === mk); const Icon = tier.icon; return <Icon key={mk} size={14} color={tier.color} />; })}
                </div>
                <span className="text-yellow-400 font-bold">{rec.score || 0}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ---------------- BİLDİRİMLER ----------------
  eğer (ekran === "bildirimler") {
    geri dönmek (
      <div className="min-h-screen w-full p-5" style={{ fontFamily: "Inter, sans-serif" }}>
        {bg}
        {Başlık(t.bildirimler, true)}
        <div className="max-w-md mx-auto space-y-2">
          {myNotifs.length === 0 && <p className="text-white/40 text-center mt-10">{t.noNotifications}</p>}
          {myNotifs.map(n => (
            <div key={n.id} className="px-4 py-3 rounded-2xl bg-white/10">
              <p className="text-white text-sm mb-2"><b>{n.from}</b> {t.invitedYouToGroup}: <b>{n.groupName}</b></p>
              <div className="flex gap-2">
                <button onClick={() => acceptGroupInvite(n)} className="flex-1 py-1.5 rounded-full text-xs font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>{t.accept}</button>
                <button onClick={() => removeNotification(n.id)} className="flex-1 py-1.5 rounded-full text-xs font-bold bg-white/10 text-white">{t.decline}</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ---------------- YÖNETİCİ ----------------
  if (screen === "admin" && me.isAdmin && googleAdminVerified) {
    geri dönmek (
      <div className="min-h-screen w-full p-5" style={{ fontFamily: "Inter, sans-serif" }}>
        {bg}
        {Başlık(t.admin, true)}
        <p className="text-white/50 text-sm mb-4 max-w-md mx-auto">{t.adminPanelDesc}</p>
        <div className="max-w-md mx-auto space-y-2">
          {Object.entries(users).map(([name, rec]) => {
            const liveGame = Object.values(games).find(gm2 => (gm2.status === "playing" || gm2.status === "spinning") && gm2.members.includes(name));
            geri dönmek (
              <div key={name} className="flex items-center justify-between px-4 py-3 rounded-2xl bg-white/10">
                <div>
                  <p className="text-white font-semibold">{name} {rec.isAdmin && <Shield size={12} className="inline text-purple-300 ml-1" />}</p>
                  <p className="text-yellow-400 text-sm font-bold">{rec.score || 0}</p>
                </div>
                <div className="flex gap-1 items-center">
                  <input type="number" value={pointInputs[name] || ""} onChange={e => setPointInputs(p => ({ ...p, [name]: e.target.value }))}
                    placeholder={String(rec.score || 0)} className="w-20 px-2 py-1.5 rounded-full bg-white/10 text-white text-xs text-center outline-none border border-white/20" />
                  <button onClick={() => {
                      if (pointInputs[name] === undefined || pointInputs[name] === "") return;
                      const newScore = parseInt(pointInputs[name], 10);
                      if (isNaN(newScore)) return;
                      setScore(name, newScore);
                      setPointInputs(p => ({ ...p, [name]: "" }));
                    }}
                    className="px-3 py-1.5 rounded-full bg-green-500/70 text-white text-xs font-bold">{t.setScoreBtn}</button>
                  {canlıOyun && (
                    <button onClick={() => { setAdminSpectateGameId(liveGame.id); setScreen("adminSpectate"); }}
                      className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-purple-600/80 hover:bg-purple-600 text-white text-xs font-bold">
                      <Play size={11} /> {t.watchMatch}
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ---------------- YÖNETİCİ İZLEYİCİ ----------------
  if (screen === "adminSpectate" && me.isAdmin && googleAdminVerified) {
    const game = games[adminSpectateGameId];
    eğer (!oyun) {
      return <GoneScreen bg={bg} message={t.groupGone} backLabel={t.back} onBack={() => setScreen("admin")} />;
    }
    return <GroupGameView game={game} me={me} t={t} lang={game.lang} isSpectator
      onSpinEnd={() => finishSpin(adminSpectateGameId)}
      onSubmitWord={() => {}}
      onNextRound={() => setScreen("admin")}
      onExitToChat={() => setScreen("admin")} onGameOver={() => setScreen("admin")} />;
  }

  null döndür;
}

// =========================================================
// GRUP OYUNU GÖRÜNÜMÜ (lobi turu için çark + aktarma zinciri)
// =========================================================
fonksiyon GrupOyunGörüntüleme({ oyun, ben, t, onSpinEnd, onSubmitWord, onNextRound, onExitToChat, onGameOver, lang, isSpectator }) {
  const [wordInput, setWordInput] = useState("");
  const [timeLeft, setTimeLeft] = useState(WORD_TIME_SECONDS);
  const [checking, setChecking] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [shake, setShake] = useState(false);
  const [flash, setFlash] = useState(null);
  const feedbackKeyRef = useRef(0);
  const timerRef = useRef(null);
  const feedbackTimeoutRef = useRef(null);
  const currentPlayer = game.members[game.turnIndex];
  const isMyTurn = !isSpectator && currentPlayer === me.username && game.status === "playing";
  const wordChain = game.wordChain || []; // Firebase, kaydetme sırasında boş dizileri siler, bu nedenle bu eksik olarak geri dönebilir.
  const lastResults = game.lastResults || []; // yukarıdakiyle aynı
  const requiredLetter = wordChain.length === 0 ? game.currentLetter : lastLetter(wordChain[wordChain.length - 1].word, lang);

  useEffect(() => {
    Sıra bende değilse geri dön;
    setTimeLeft(WORD_TIME_SECONDS);
    clearInterval(timerRef.current);
    zamanlayıcıRef.current = setInterval(() => {
      setTimeLeft(tl => {
        Eğer tl 1'den küçük veya eşitse, zamanlayıcı referansının mevcut değerini temizleyip, işlemi doğru şekilde gerçekleştirip, 0 değerini döndürün.
        tl - 1'i döndür;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [isMyTurn, game.turnIndex]); // eslint-disable-line

  useEffect(() => () => clearTimeout(feedbackTimeoutRef.current), []);

  fonksiyon showFeedback(ok, word) {
    clearTimeout(feedbackTimeoutRef.current);
    setFeedback({ ok, word, key: ++feedbackKeyRef.current });
    if (!ok) { setShake(true); setTimeout(() => setShake(false), 420); }
    feedbackTimeoutRef.current = setTimeout(() => setFeedback(null), 1600);
  }

  asenkron fonksiyon handleSubmit(zaman aşımı) {
    clearInterval(timerRef.current);
    const w = timedOut ? "" : wordInput.trim();
    setWordInput("");
    Eğer "w" yoksa, "showFeedback(false), setFlash({ ok: false, key: ++feedbackKeyRef.current }), onSubmitWord("", false, timedOut); return; }
    setChecking(true);
    const ok = await checkWordValid(w, lang, requiredLetter);
    setChecking(false);
    showFeedback(ok, w);
    setFlash({ ok, key: ++feedbackKeyRef.current });
    onSubmitWord(w, ok, false);
  }

  geri dönmek (
    <div className="min-h-screen w-full p-5 flex flex-col items-center" style={{ fontFamily: "Inter, sans-serif" }}>
      <div className="fixed inset-0 -z-10" style={{ background: "radial-gradient(ellipse at 25% 15%, #2d1755 0%, #1c0f38 45%, #0f0a1e 100%)" }} />
      {flash && <FullScreenFlash key={flash.key} ok={flash.ok} onDone={() => setFlash(null)} />}
      <button onClick={onExitToChat} className="absolute top-5 left-5 p-2 rounded-full bg-white/10 text-white"><ArrowLeft size={18} /></button>
      {isSpectator && (
        <span className="absolute top-5 right-5 flex items-center gap-1 px-3 py-2 rounded-full bg-purple-600/70 text-white text-xs font-bold">
          <Shield size={12} /> {t.spectating}
        </span>
      )}
      <p className="text-white/40 text-xs mt-14 mb-2">{t.roundOf} {game.roundNumber} · {wordChain.length}{t.of}{ROUND_WORD_LIMIT}</p>

      {(game.status === "spinning" || (game.status === "playing" && wordChain.length === 0)) && (
        <div className="flex flex-col items-center mt-4">
          <Wheel lang={lang} spinning={game.status === "spinning"} resultLetter={game.currentLetter} onSpinEnd={onSpinEnd} excludeFirst={lang === "tr" ? "Ğ" : null} />
          {game.status === "playing" && <p className="text-3xl font-black text-yellow-400 mt-4">{game.currentLetter}</p>}
        </div>
      )}

      {game.status === "oynuyor" && (
        <div className="w-full max-w-sm mt-6">
          <div className="flex flex-wrap gap-2 justify-center mb-6">
            {game.members.map((m, i) => (
              <span key={m} className={`px-3 py-1.5 rounded-full text-xs font-semibold ${i === game.turnIndex ? "bg-yellow-400 text-[#1b1030]" : "bg-white/10 text-white/60"}`}>{m}</span>
            ))}
          </div>
          {wordChain.length > 0 && (
            <div className="text-center mb-4 text-white/70 text-sm">
              {wordChain[wordChain.length - 1].username}: <b className="text-white">{wordChain[wordChain.length - 1].word || "—"}</b>
            </div>
          )}
          <div className="text-center mb-3">
            <p className="text-white/50 text-sm">{isMyTurn ? t.yourTurn : `${currentPlayer}...`}</p>
            <p className="text-white text-lg"><b className="text-yellow-400 text-2xl">{requiredLetter}</b> {t.writeWordStartingWith}</p>
          </div>
          <div className="mb-3 min-h-[44px] flex items-center justify-center">
            <WordFeedbackBadge feedback={feedback} t={t} />
          </div>
          {isMyTurn && (
            <>
              <div className="flex items-center justify-center gap-1 text-white/60 text-sm mb-2"><Clock size={14} /> {timeLeft}s</div>
              <div className="flex gap-2">
                <input autoFocus value={wordInput} onChange={e => setWordInput(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSubmit(false)}
                  devre dışı={kontrol ediliyor} sınıf adı="flex-1 px-4 py-3 rounded-full bg-white/10 text-white outline-none border-2 border-yellow-400/40"
                  style={{ animation: shake ? "inputShake 420ms ease" : "none" }} />
                <button onClick={() => handleSubmit(false)} disabled={checking} className="px-5 py-3 rounded-full font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>
                  {checking ? t.checking : t.submit}
                </button>
              </div>
            </>
          )}
        </div>
      )}

      {game.status === "results" && (
        <div className="w-full max-w-sm mt-6">
          <h3 className="text-white font-bold text-center mb-1" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.roundResults}</h3>
          <p className="text-white/40 text-xs text-center mb-4">{lastResults.length} {t.roundOf.toLowerCase()}</p>

          {lastResults.length > 0 && lastResults.every(r => r.points > 0) && (
            <div className="mb-4 px-4 py-3 rounded-2xl text-center font-bold text-sm"
              style={{ background: "#f2b70522", border: "1px solid #f2b70566", color: "#f2b705" }}>
              🎉 {t.groupAllCorrectMsg}
            </div>
          )}

          {/* Bu tur için oyuncu başına toplamlar */}
          <div className="flex flex-wrap gap-2 justify-center mb-4">
            {game.members.map(m => {
              const total = lastResults.filter(r => r.username === m).reduce((s, r) => s + r.points, 0);
              geri dönmek (
                <span key={m} className="px-3 py-1.5 rounded-full text-xs font-bold bg-white/10 text-white">
                  {m}: <span className="text-yellow-400">{toplam}</span>
                </span>
              );
            })}
          </div>

          <div className="space-y-2 mb-6 overflow-y-auto pr-1" style={{ maxHeight: "42vh" }}>
            {lastResults.map((r, i) => (
              <div key={i} className="flex items-center justify-between px-4 py-3 rounded-2xl bg-white/10">
                <span className="text-white">{r.username}: <b>{r.word || t.noWord}</b></span>
                <span className={`font-bold ${r.points > 0 ? "text-green-400" : "text-red-400"}`}>+{r.points} {t.points}</span>
              </div>
            ))}
          </div>
          <button onClick={isSpectator ? onExitToChat : onNextRound} className="w-full py-3 rounded-full font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>{isSpectator ? t.spectateBack : t.back}</button>
        </div>
      )}

      {game.status === "gameover" && (
        <div className="w-full max-w-sm mt-16 text-center">
          <div className="rounded-3xl p-7" style={{ background: "linear-gradient(160deg,#2c1750,#1b1030)", border: "2px solid #ff6f61" }}>
            <X size={40} color="#ff6f61" className="mx-auto mb-3" />
            <h2 className="text-xl font-bold text-white mb-2" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.duplicateWordTitle}</h2>
            <p className="text-white/80 mb-1">
              <b>{game.gameOverBy}</b>{lang === "en" ? " — " : ": "}<b className="text-yellow-400">"{game.gameOverWord}</b>
            </p>
            <p className="text-white/70 text-sm mb-5">{t.duplicateWordMsg}</p>
            <button onClick={isSpectator ? onExitToChat : onGameOver} className="w-full py-2.5 rounded-full font-bold" style={{ background: "#ff6f61", color: "#1b1030" }}>
              {isSpectator ? t.spectateBack : t.backToMenu}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// TEK OYUNCULU GÖRÜNÜM

fonksiyon SoloGameView({ t, lang, me, onAddPoints, onExit }) {
  const [status, setStatus] = useStatus("wheel"); // tekerlek, dönme, oynama
  const [letter, setLetter] = useState(null);
  const [zincir, setChain] = useState([]);
  const [wordInput, setWordInput] = useState("");
  const [checking, setChecking] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [shake, setShake] = useState(false);
  const [flash, setFlash] = useState(null);
  const [allCorrectMsg, setAllCorrectMsg] = useState(false);
  const [gameOverWord, setGameOverWord] = useState(null);
  const feedbackKeyRef = useRef(0);
  const [timeLeft, setTimeLeft] = useState(WORD_TIME_SECONDS);
  const timerRef = useRef(null);
  const required = chain.length === 0 ? letter : lastLetter(chain[chain.length - 1].word, lang);

  useEffect(() => {
    Eğer durum "oynuyor" değilse, geri dön;
    setTimeLeft(WORD_TIME_SECONDS);
    clearInterval(timerRef.current);
    zamanlayıcıRef.current = setInterval(() => {
      setTimeLeft(tl => {
        Eğer tl değeri 1'den küçük veya eşitse, zamanlayıcı referansının geçerli olduğu aralığı temizle ve işlemi başlat (true) olarak gönder; 0 döndür.
        tl - 1'i döndür;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [status, chain.length]); // eslint-disable-line

  fonksiyon spin() {
    const letters = ALPHABETS[lang].filter(l => lang === "tr" ? l !== "Ğ" : true);
    const pick = letters[Math.floor(Math.random() * letters.length)];
    setLetter(pick);
    setChain([]);
    setFeedback(null);
    setStatus("spinning");
  }

  fonksiyon flashFeedback(ok, word) {
    setFeedback({ ok, word, key: ++feedbackKeyRef.current });
    if (!ok) { setShake(true); setTimeout(() => setShake(false), 420); }
  }

  asenkron fonksiyon submit(zaman aşımı) {
    clearInterval(timerRef.current);
    const w = timedOut ? "" : wordInput.trim();
    setWordInput("");

    eğer (zaman aşımı) {
      // süre gelişmedi: seri burada bozulur, en baştan çark çevirmeye dönüş
      flaşGeriBildirim(yanlış, "");
      setFlash({ ok: false, key: ++feedbackKeyRef.current });
      setTimeout(() => { setStatus("wheel"); setChain([]); }, 1200);
      geri dönmek;
    }

    eğer (!w) {
      flashFeedback(false, ""); setFlash({ ok: false, key: ++feedbackKeyRef.current });
      const newChain = [...chain, { word: "", points: 0 }]; setChain(newChain);
      if (newChain.length >= ROUND_WORD_LIMIT) setTimeout(() => { setStatus("wheel"); setChain([]); }, 1200);
      geri dönmek;
    }

    const isDuplicate = chain.some(c => c.word && normalizeWord(c.word, lang) === normalizeWord(w, lang));
    eğer (aynı dosya ise) {
      // aynı kelime bu turda daha önce kullanılmış: oyun burada bit
      flaşGeriBildirim(yanlış, w);
      setFlash({ ok: false, key: ++feedbackKeyRef.current });
      OyunBitirmeKelimesini ayarla(w);
      geri dönmek;
    }

    setChecking(true);
    const ok = await checkWordValid(w, lang, required);
    setChecking(false);
    Eğer (tamamsa) onAddPoints(POINTS_PER_WORD) işlemini bekleyin;
    flaşGeriBildirim(tamam, w);
    setFlash({ ok, key: ++feedbackKeyRef.current });
    const newChain = [...chain, { word: w, points: ok ? POINTS_PER_WORD : 0 }];
    setChain(newChain);
    if (newChain.length >= ROUND_WORD_LIMIT) {
      const allCorrect = newChain.every(c => c.points > 0);
      eğer (hepsi doğruysa) {
        await onAddPoint(STREAK_BONUS);
        setAllCorrectMsg(true);
        setTimeout(() => { setStatus("wheel"); setChain([]); setAllCorrectMsg(false); }, 2200);
      } başka {
        setTimeout(() => { setStatus("wheel"); setChain([]); }, 1200);
      }
    }
  }

  geri dönmek (
    <div className="min-h-screen w-full p-5 flex flex-col items-center" style={{ fontFamily: "Inter, sans-serif" }}>
      <div className="fixed inset-0 -z-10" style={{ background: "radial-gradient(ellipse at 25% 15%, #2d1755 0%, #1c0f38 45%, #0f0a1e 100%)" }} />
      {flash && <FullScreenFlash key={flash.key} ok={flash.ok} onDone={() => setFlash(null)} />}
      <button onClick={onExit} className="absolute top-5 left-5 p-2 rounded-full bg-white/10 text-white"><ArrowLeft size={18} /></button>
      {allCorrectMsg && (
        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-center font-bold text-sm shadow-lg"
          stil={{ arka plan: "#f2b705", renk: "#1b1030", maksimum genişlik: "88vw" }}>
          🎉 {t.soloAllCorrectMsg}
        </div>
      )}
      <p className="text-white/40 text-xs mt-14 mb-2">{t.solo} · {t.roundOf} {chain.length}{t.of}{ROUND_WORD_LIMIT}</p>

      {gameOverWord && (
        <div className="w-full max-w-sm mt-16 text-center">
          <div className="rounded-3xl p-7" style={{ background: "linear-gradient(160deg,#2c1750,#1b1030)", border: "2px solid #ff6f61" }}>
            <X size={40} color="#ff6f61" className="mx-auto mb-3" />
            <h2 className="text-xl font-bold text-white mb-2" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.duplicateWordTitle}</h2>
            <p className="text-white/80 mb-1"><b className="text-yellow-400">"{gameOverWord}"</b></p>
            <p className="text-white/70 text-sm mb-5">{t.duplicateWordMsg}</p>
            <button onClick={onExit} className="w-full py-2.5 rounded-full font-bold" style={{ background: "#ff6f61", color: "#1b1030" }}>
              {t.backToMenu}
            </button>
          </div>
        </div>
      )}

      {!gameOverWord && status !== "playing" && (
        <div className="flex flex-col items-center mt-4">
          <Wheel lang={lang} spinning={status === "spinning"} resultLetter={letter} excludeFirst={lang === "tr" ? "Ğ" : null}
            onSpinEnd={() => setStatus("oynuyor")} />
          {durum === "tekerlek" && (
            <button onClick={spin} className="mt-8 px-8 py-4 rounded-full font-bold text-lg flex items-center gap-2" style={{ background: "#f2b705", color: "#1b1030", fontFamily: "Fredoka, sans-serif" }}>
              <Play size={20} /> {t.spinWheel}
            </button>
          )}
        </div>
      )}

      {!gameOverWord && status === "oynuyor" && (
        <div className="w-full max-w-sm mt-6">
          <div className="text-center mb-4">
            <p className="text-white text-lg"><b className="text-yellow-400 text-2xl">{required}</b> {t.writeWordStartingWith}</p>
          </div>
          <div className="flex items-center justify-center gap-1 text-sm mb-2" style={{ color: timeLeft <= 5 ? "#ff6f61" : "rgba(255,255,255,0.6)" }}>
            <Saat boyutu={14} /> {Kalan süre}s
          </div>
          <div className="flex gap-2 mb-4">
            <input autoFocus value={wordInput} onChange={e => setWordInput(e.target.value)} onKeyDown={e => e.key === "Enter" && submit(false)}
              devre dışı={kontrol ediliyor} sınıf adı="flex-1 px-4 py-3 rounded-full bg-white/10 text-white outline-none border-2 border-yellow-400/40"
              style={{ animation: shake ? "inputShake 420ms ease" : "none" }} />
            <button onClick={() => submit(false)} disabled={checking} className="px-5 py-3 rounded-full font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>
              {checking ? t.checking : t.submit}
            </button>
          </div>
          <div className="mb-2 min-h-[44px] flex items-center justify-center">
            <WordFeedbackBadge feedback={feedback} t={t} />
          </div>
          <div className="mt-4 flex flex-wrap gap-1 justify-center">
            {zincir.dilim(-10).map((c, i) => (
              <span key={i} className={`px-2 py-1 rounded-full text-xs ${c.points > 0 ? "bg-green-500/20 text-green-300" : "bg-red-500/20 text-red-300"}`}>{c.word || "—"}</span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// Güvenlik önlemi: Uygulamanın herhangi bir yerinde, render işlemi sırasında herhangi bir hata oluşursa (örneğin bir
// Verinin beklenmedik şekli), aksi takdirde React her şeyi kaldırır ve
// Sayfanın düz koyu arka planını ("siyah ekran") görünür bırakın.
// Bu hatayı yakalar ve bunun yerine yeniden yükleme düğmesi bulunan kurtarılabilir bir ekran gösterir.
class ErrorBoundary extends React.Component {
  yapıcı(özellikler) {
    süper(özellikler);
    bu.durum = { hata var: false };
  }
  statik getDerivedStateFromError() {
    Hata döndür { hasError: true };
  }
  componentDidCatch(error, info) {
    console.error("Uygulama hatası:", hata, bilgi);
  }
  render() {
    if (this.state.hasError) {
      geri dönmek (
        <div style={{
          minHeight: "100vh", width: "100%", display: "flex", flexDirection: "column",
          Öğeleri hizala: "ortala", İçeriği hizala: "ortala", boşluk: 16, dolgu: 24, Metin hizala: "ortala",
          arka plan: "radyal-eğim (ellips %25 %15, #2d1755 %0, #1c0f38 %45, #0f0a1e %100)",
          renk: "#fff", yazı tipi ailesi: "Inter, sans-serif",
        }}>
          <p style={{ fontSize: 18, fontWeight: 700 }}>Bir şeyler ters gitti</p>
          <p style={{ opacity: 0.6, fontSize: 13, maxWidth: 280 }}>Ekran kilitlenmiş olabilir. Devam etmek için yazılımı yeniden yükleyin.</p>
          <button onClick={() => window.location.reload()} style={{ padding: "12px 28px", borderRadius: 999, background: "#f2b705", color: "#1b1030", fontWeight: 700, border: "none" }}>
            Yeniden Yükle
          </button>
        </div>
      );
    }
    this.props.children'ı döndür;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
