// Bir grubun GÜNLÜK oyun hakkı: duvar-saati değil, içinde fiilen oyun
// oynanan (spinning/playing) toplam süredir. Grup hiç oynanmazsa bu süre
// hiç azalmaz. Bu hak her gün saat 09:00'da sıfırlanır (aşağıdaki
// GROUP_DAILY_RESET_HOUR) — grup asla kapanmaz/silinmez, sadece o günkü
// 2 saat dolunca ertesi 09:00'a kadar yeni oyun başlatılamaz.
const GROUP_BUDGET_MS = 2 * 60 * 60 * 1000;
const GROUP_DAILY_RESET_HOUR = 9; // her gün saat 09:00'da yenilenir

// "Oyun günü" 09:00'dan ertesi gün 09:00'a kadar sürer. Bu fonksiyon,
// verilen `now` anının içinde bulunduğu oyun gününün başlangıç zamanını
// (o günün veya -henüz 09:00 olmadıysa- dünün 09:00'ı) döndürür.
function getGroupPeriodStart(now) {
  const d = new Date(now);
  d.setHours(GROUP_DAILY_RESET_HOUR, 0, 0, 0);
  if (d.getTime() > now) d.setDate(d.getDate() - 1);
  return d.getTime();
}

// Şu anki periyodun ne zaman biteceğini (bir sonraki 09:00'ı) döndürür.
function getGroupNextResetAt(now) {
  return getGroupPeriodStart(now) + 24 * 60 * 60 * 1000;
}

// Bir sonraki sıfırlanmanın "bugün" mü yoksa "yarın" mı olacağını
// (takvim günü karşılaştırarak) belirler; saat 03:00 gibi gece yarısını
// geçmiş ama henüz 09:00 olmamış saatlerde de doğru sonucu verir.
function isGroupResetToday(now) {
  const resetAt = getGroupNextResetAt(now);
  const a = new Date(resetAt), b = new Date(now);
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

// ---------- storage helpers (Firebase Realtime Database-backed shared state) ----------
// window.__fbdb normally gets set synchronously by the <script> block in
// <head> right after the Firebase SDK tags. But on a slow/unstable
// connection those SDK files can fail to load (or initializeApp can throw),
// leaving window.__fbdb undefined — which used to crash the whole app with
// "Cannot read properties of undefined (reading 'ref')" the moment
// subscribeShared ran. waitForFbdb waits a few seconds for it to show up
// before giving up with a clear, readable error instead of that crash.
function waitForFbdb(timeoutMs = 8000) {
  return new Promise((resolve, reject) => {
    if (window.__fbdb) return resolve(window.__fbdb);
    const start = Date.now();
    const iv = setInterval(() => {
      if (window.__fbdb) { clearInterval(iv); resolve(window.__fbdb); return; }
      if (Date.now() - start > timeoutMs) {
        clearInterval(iv);
        reject(window.__fbInitError || new Error("Firebase'e bağlanılamadı (internet bağlantınızı kontrol edip sayfayı yenileyin)."));
      }
    }, 150);
  });
}
async function loadShared(key, fallback) {
  try {
    const db = await waitForFbdb();
    const snap = await db.ref(key).get();
    const val = snap.exists() ? snap.val() : null;
    return (val !== null && val !== undefined) ? val : fallback;
  } catch (e) {
    console.error("loadShared(" + key + ") failed", e);
    return fallback;
  }
}
async function saveShared(key, value) {
  try {
    const db = await waitForFbdb();
    await db.ref(key).set(value);
  } catch (e) {
    console.error("saveShared(" + key + ") failed", e);
  }
}
// live subscription helper (used to push instant updates instead of waiting for the poll interval)
function subscribeShared(key, cb) {
  let ref = null, handler = null, cancelled = false;
  waitForFbdb().then(db => {
    if (cancelled) return;
    ref = db.ref(key);
    handler = (snap) => cb(snap.exists() ? snap.val() : {});
    ref.on("value", handler);
  }).catch(e => console.error("subscribeShared(" + key + ") failed", e));
  return () => {
    cancelled = true;
    if (ref && handler) ref.off("value", handler);
  };
}

// ---- atomic single-record helpers ----
// The bug behind "her katılımcı gruptan bağımsız hareket ediyor" and the
// occasional broken spin was that every action (spin, submit word, join,
// leave...) used to read the WHOLE "games" object, change one game inside
// it, and .set() the WHOLE object back. If two clients did this within
// milliseconds of each other (very common in a live group game), the
// second .set() would silently wipe out whatever the first one had just
// written — so different players ended up seeing different, diverging
// states of the same match. Firebase's transaction() runs against a single
// record (games/<id> or users/<username>) and automatically retries with
// the latest server value if another client wrote in the meantime, so
// concurrent actions from different players can no longer clobber each
// other.
async function transactRecord(path, mutator) {
  const db = await waitForFbdb();
  const ref = db.ref(path);
  const result = await ref.transaction(current => mutator(current));
  return result.committed ? result.snapshot.val() : null;
}
async function updatePaths(updates) {
  // Firebase multi-path update: only the listed paths are touched, so this
  // never clobbers unrelated games/groups the way overwriting the entire
  // "games" or "groups" node used to.
  const db = await waitForFbdb();
  await db.ref().update(updates);
}

// ---------- word check: real dictionary lookup via Wiktionary's public,
// key-free, CORS-enabled API (no backend needed).
// Always queries English Wiktionary (by far the most complete edition) and
// checks that the page actually has a section for the SELECTED language —
// otherwise e.g. a Turkish word would wrongly pass while playing in English,
// since Wiktionary pages list translations across many languages. ----------
const WIKT_LANG_HEADER = { en: "English", tr: "Turkish", de: "German" };

async function checkWordValid(word, lang, mustStartWith) {
  const w = word.trim();
  if (w.length < 2) return false;
  const locale = lang === "tr" ? "tr-TR" : undefined;
  const wFirst = w[0].toLocaleUpperCase(locale);
  const reqUpper = mustStartWith.toLocaleUpperCase(locale);
  if (wFirst !== reqUpper) return false; // wrong starting letter — no need to hit the network

  const headerName = WIKT_LANG_HEADER[lang] || "English";
  const headerRegex = new RegExp(`^==\\s*${headerName}\\s*==`, "m");
  const candidates = [w.toLocaleLowerCase(locale), w]; // most entries are lowercase; also try as-typed

  for (const candidate of candidates) {
    try {
      const url = `https://en.wiktionary.org/w/api.php?action=query&prop=revisions&titles=${encodeURIComponent(candidate)}&rvprop=content&rvslots=main&formatversion=2&format=json&origin=*`;
      const res = await fetch(url);
      const data = await res.json();
      const pages = (data && data.query && data.query.pages) || [];
      for (const page of pages) {
        if (page.missing) continue;
        const rev = page.revisions && page.revisions[0];
        const content = rev ? (rev.content || (rev.slots && rev.slots.main && rev.slots.main.content) || "") : "";
        if (content && headerRegex.test(content)) return true; // confirmed: this page has a section specifically for the selected language
      }
    } catch (e) {
      console.error("dictionary lookup failed", e);
      // network hiccup: don't hard-fail on this candidate, try the next one / fall through
    }
  }
  return false;
}

function lastLetter(word, lang) {
  const w = word.trim();
  if (!w) return "";
  // handle Turkish dotted/dotless i correctly by just taking the last unicode char
  return w[w.length - 1].toLocaleUpperCase(lang === "tr" ? "tr-TR" : undefined);
}
function firstLetter(word, lang) {
  const w = word.trim();
  if (!w) return "";
  return w[0].toLocaleUpperCase(lang === "tr" ? "tr-TR" : undefined);
}
// normalized form used to compare two words for exact (case-insensitive) equality,
// so "Kedi" and "kedi" count as the same word within a round.
function normalizeWord(word, lang) {
  const w = (word || "").trim();
  if (!w) return "";
  return w.toLocaleLowerCase(lang === "tr" ? "tr-TR" : undefined);
}

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

function formatRemaining(ms) {
  if (ms <= 0) return "0:00";
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  return `${m}:${String(s).padStart(2, "0")}`;
}

// Bir grubun o GÜNKÜ (mevcut 09:00-09:00 periyodundaki) 2 saatlik
// hakkından ne kadarının kaldığını hesaplar. Bu, biriken (kapanmış
// oturumlardan) usedMs ile, eğer şu an bir round fiilen oynanıyorsa
// (spinning/playing) activeSince'ten bu yana geçen sürenin toplamıdır.
// Grup hiç oynanmadıysa süre hiç azalmaz. Veritabanındaki periodStart şu
// anki periyottan farklıysa (yani 09:00 geçilmiş ama henüz veritabanına
// yazılmamışsa) burada da sıfırlanmış gibi gösterilir — böylece "süre
// doldu" uyarısı, günün sayaçları arka planda henüz sıfırlanmamış olsa
// bile 09:00'ı geçer geçmez ekrandan kalkar. Eski (bu özellikten önce
// oluşmuş) gruplar için usedMs alanı yoktur; onlar için null döner (süresiz).
function groupRemainingMs(g, gamesObj, now) {
  if (!g || g.usedMs === undefined) return null;
  const currentPeriod = getGroupPeriodStart(now);
  const samePeriod = g.periodStart === currentPeriod;
  const usedMs = samePeriod ? (g.usedMs || 0) : 0;
  const activeSince = samePeriod ? (g.activeSince || null) : null;
  const isPlaying = Object.values(gamesObj || {}).some(
    gm2 => gm2 && gm2.groupId === g.id && (gm2.status === "playing" || gm2.status === "spinning")
  );
  const consumed = usedMs + (activeSince && isPlaying ? now - activeSince : 0);
  return GROUP_BUDGET_MS - consumed;
}

// WHEEL COMPONENT
// =========================================================
function Wheel({ lang, spinning, resultLetter, onSpinEnd, size = 260, excludeFirst }) {
  const letters = ALPHABETS[lang].filter(l => (excludeFirst ? l !== excludeFirst : true));
  const [rotation, setRotation] = useState(0);
  const [animate, setAnimate] = useState(false);
  const sliceAngle = 360 / letters.length;
  const prevSpinning = useRef(false);
  const fallbackRef = useRef(null);
  const doneRef = useRef(false);

  function fireSpinEnd() {
    if (doneRef.current) return;
    doneRef.current = true;
    clearTimeout(fallbackRef.current);
    onSpinEnd && onSpinEnd();
  }

  useEffect(() => {
    if (spinning && !prevSpinning.current && resultLetter) {
      doneRef.current = false;
      const idx = letters.indexOf(resultLetter);
      const targetIdx = idx >= 0 ? idx : 0;
      // angle to bring slice center to top pointer (0deg)
      const sliceCenter = targetIdx * sliceAngle + sliceAngle / 2;
      const target = (360 - sliceCenter + 360) % 360;
      // Bazı tarayıcılarda/cihazlarda component ilk kez mount olurken
      // transition ile transform aynı anda değişince tarayıcı animasyonu
      // hiç oynatmadan direkt son açıya atlıyor (bu da "çark bazı
      // kişilerde dönmüyor" bugının asıl sebebiydi: animasyon oynamayınca
      // transitionend hiç tetiklenmiyor ve oyun "spinning" durumunda
      // sonsuza kadar takılı kalıyordu). Bunu önlemek için önce animasyonu
      // kapatıp mevcut açıda bir kare çizdiriyoruz, sonraki karede
      // animasyonu açıp hedef açıya geçiyoruz — böylece tarayıcı geçişi
      // her zaman gerçekten oynatmak zorunda kalıyor.
      setAnimate(false);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          setAnimate(true);
          setRotation(r => {
            const currentMod = ((r % 360) + 360) % 360;
            const delta = ((target - currentMod) + 360) % 360;
            return r + 360 * 6 + delta;
          });
        });
      });
      // Güvenlik ağı: transitionend bir sebeple hiç tetiklenmezse (arka
      // plana alınmış sekme, düşük güçlü cihaz, vb.) oyun sonsuza kadar
      // takılı kalmasın diye animasyon süresinden biraz uzun bir süre
      // sonra otomatik olarak devam ettiriyoruz.
      clearTimeout(fallbackRef.current);
      fallbackRef.current = setTimeout(fireSpinEnd, 3900);
    }
    prevSpinning.current = spinning;
    return () => clearTimeout(fallbackRef.current);
  }, [spinning, resultLetter]); // eslint-disable-line

  return (
    <div className="relative select-none" style={{ width: size, height: size }}>
      <div
        className="absolute left-1/2 -top-3 z-20"
        style={{ transform: "translateX(-50%)", width: 0, height: 0, borderLeft: "12px solid transparent", borderRight: "12px solid transparent", borderTop: "20px solid #f2b705", filter: "drop-shadow(0 2px 3px rgba(0,0,0,.5))" }}
      />
      <div
        className="absolute inset-0 rounded-full"
        style={{
          transform: `rotate(${rotation}deg)`,
          transition: animate ? "transform 3.2s cubic-bezier(.17,.67,.14,1)" : "none",
          boxShadow: "0 0 0 6px #3a2265, 0 0 0 10px #f2b70555, 0 20px 50px rgba(0,0,0,.55)",
        }}
        onTransitionEnd={() => { if (spinning) fireSpinEnd(); }}
      >
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <circle cx="100" cy="100" r="99" fill="#241542" />
          {letters.map((l, i) => {
            const a0 = (i * sliceAngle - 90) * (Math.PI / 180);
            const a1 = ((i + 1) * sliceAngle - 90) * (Math.PI / 180);
            const x0 = 100 + 99 * Math.cos(a0), y0 = 100 + 99 * Math.sin(a0);
            const x1 = 100 + 99 * Math.cos(a1), y1 = 100 + 99 * Math.sin(a1);
            const large = sliceAngle > 180 ? 1 : 0;
            const mid = (a0 + a1) / 2;
            const lx = 100 + 68 * Math.cos(mid), ly = 100 + 68 * Math.sin(mid);
            const fill = i % 2 === 0 ? "#2c1750" : "#33204f";
            return (
              <g key={l}>
                <path d={`M100,100 L${x0},${y0} A99,99 0 ${large} 1 ${x1},${y1} Z`} fill={fill} stroke="#4a2f7a" strokeWidth="1" />
                <text x={lx} y={ly} fill="#f5f0ff" fontSize="11" fontWeight="700" textAnchor="middle" dominantBaseline="middle"
                  transform={`rotate(${(mid * 180 / Math.PI) + 90}, ${lx}, ${ly})`}>{l}</text>
              </g>
            );
          })}
          <circle cx="100" cy="100" r="16" fill="#f2b705" stroke="#3a2265" strokeWidth="3" />
        </svg>
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState("tr");
  const t = T[lang];
  const [screen, setScreen] = useState("auth"); // auth, menu, groups, chat, lobby, game, solo, leaderboard, notifications, admin
  const [authMode, setAuthMode] = useState("login");
  const [authForm, setAuthForm] = useState({ username: "", password: "" });
  const [authError, setAuthError] = useState("");
  const [me, setMe] = useState(null); // {username, isAdmin, score, medals}
  const [googleAdminVerified, setGoogleAdminVerified] = useState(false);
  const [googleAdminEmail, setGoogleAdminEmail] = useState(null);
  const [googleAdminBusy, setGoogleAdminBusy] = useState(false);
  const [googleAdminError, setGoogleAdminError] = useState("");
  const [users, setUsers] = useState({});
  const [groups, setGroups] = useState({});
  const [activeGroupId, setActiveGroupId] = useState(null);
  const [activeGameId, setActiveGameId] = useState(null);
  const [games, setGames] = useState({});
  const [showCreateGroup, setShowCreateGroup] = useState(false);
  const [newGroupName, setNewGroupName] = useState("");
  const [showGroupInvite, setShowGroupInvite] = useState(false);
  const [groupInviteSearch, setGroupInviteSearch] = useState("");
  const [showMedalInfo, setShowMedalInfo] = useState(false);
  const [adminSpectateGameId, setAdminSpectateGameId] = useState(null);
  const [medalPopup, setMedalPopup] = useState(null);
  const [scoreInputs, setScoreInputs] = useState({}); // admin panel: per-user typed score value
  const [sessionChecked, setSessionChecked] = useState(false); // "remember this phone" auto-login check
  const [tick, setTick] = useState(Date.now());
  useEffect(() => {
    const iv = setInterval(() => setTick(Date.now()), 1000);
    return () => clearInterval(iv);
  }, []);

  // ---- daily group play-time sweep: a group's 2-hour daily budget only
  // counts time during which a round is actually being played
  // (spinning/playing) in it — sitting in chat, or waiting in a lobby that
  // never starts, never burns any of it. Once 09:00 passes, the budget for
  // every group resets on its own (the group itself is NEVER closed or
  // deleted for running out of time — starting a *new* game is simply
  // blocked until the next 09:00, see sendGameInvite). ----
  function cleanExpiredGroups(groupsObj, gamesObj) {
    const now = Date.now();
    const currentPeriod = getGroupPeriodStart(now);
    const nextGroups = { ...groupsObj };
    // groupUpdates/gameUpdates only ever contain the specific records that
    // actually changed (keyed by their full db path), so the caller can
    // save them with a Firebase multi-path update() instead of overwriting
    // the entire "groups"/"games" tree — the periodic sweep used to do a
    // full-tree overwrite every 5s on every connected client, which is
    // exactly what was clobbering other players' concurrent game actions.
    const groupUpdates = {};
    for (const [id, g] of Object.entries(groupsObj)) {
      if (g.usedMs === undefined) continue; // legacy groups created before this feature: never track/limit
      const gamesForGroup = Object.values(gamesObj || {}).filter(gm2 => gm2 && gm2.groupId === id);
      const isPlaying = gamesForGroup.some(gm2 => gm2.status === "playing" || gm2.status === "spinning");

      let usedMs = g.usedMs || 0;
      let activeSince = g.activeSince || null;
      let periodStart = g.periodStart !== undefined ? g.periodStart : currentPeriod;
      let touched = false;

      // saat 09:00 geçildiyse (yeni bir "oyun günü" başladıysa) günlük
      // sayaç sıfırlanır
      if (periodStart !== currentPeriod) {
        usedMs = 0;
        activeSince = isPlaying ? now : null;
        periodStart = currentPeriod;
        touched = true;
      } else if (isPlaying && !activeSince) {
        // start/stop the active-play stopwatch as playing begins/ends
        activeSince = now; touched = true;
      } else if (!isPlaying && activeSince) {
        usedMs += now - activeSince;
        activeSince = null; touched = true;
      }

      if (touched) {
        const updated = { ...g, usedMs, activeSince, periodStart, pendingDelete: false };
        nextGroups[id] = updated;
        groupUpdates["groups/" + id] = updated;
      }
    }
    const nextGames = { ...gamesObj };
    const gameUpdates = {};
    for (const [gid, game] of Object.entries(gamesObj)) {
      if (!nextGroups[game.groupId]) { delete nextGames[gid]; gameUpdates["games/" + gid] = null; }
    }
    return { groups: nextGroups, games: nextGames, groupUpdates, gameUpdates };
  }

  // ---- initial load (also reusable as a one-off refresh, e.g. right after auth) ----
  const refreshAll = useCallback(async () => {
    const [u, g0, gm0] = await Promise.all([
      loadShared("users", {}),
      loadShared("groups", {}),
      loadShared("games", {}),
    ]);
    const { groups: g, games: gm, groupUpdates, gameUpdates } = cleanExpiredGroups(g0, gm0);
    const cleanupUpdates = { ...groupUpdates, ...gameUpdates };
    if (Object.keys(cleanupUpdates).length) await updatePaths(cleanupUpdates);
    setUsers(u); setGroups(g); setGames(gm);
    return { u, g, gm };
  }, []);

  useEffect(() => { refreshAll(); }, [refreshAll]);

  // ---- "remember this phone": once someone logs in successfully on this
  // device, we save a small session marker in localStorage. On the next
  // visit from the same phone/browser we skip the Google + username/password
  // screen entirely and log the same account back in automatically. ----
  useEffect(() => {
    (async () => {
      try {
        const saved = JSON.parse(localStorage.getItem("kt_session") || "null");
        if (saved && saved.username) {
          const { u } = await refreshAll();
          const rec = u[saved.username];
          if (rec) {
            setGoogleAdminVerified(true);
            setGoogleAdminEmail(saved.googleAdminEmail || null);
            setMe({ username: saved.username, isAdmin: !!rec.isAdmin, score: rec.score || 0, medals: medalsForScore(rec.score || 0) });
            setScreen("menu");
          } else {
            localStorage.removeItem("kt_session");
          }
        }
      } catch (e) {
        localStorage.removeItem("kt_session");
      }
      setSessionChecked(true);
    })();
  }, []); // eslint-disable-line

  // ---- live sync: Firebase Realtime Database pushes changes to every
  // connected client instantly, so no more polling on an interval ----
  useEffect(() => {
    const unsubUsers = subscribeShared("users", setUsers);
    const unsubGroups = subscribeShared("groups", setGroups);
    const unsubGames = subscribeShared("games", setGames);
    const unsubPresence = subscribeShared("presence", setOnlineUsers);
    const unsubNotifs = subscribeShared("notifications", setAllNotifs);
    return () => { unsubUsers(); unsubGroups(); unsubGames(); unsubPresence(); unsubNotifs(); };
  }, []);

  // ---- online presence: while logged in, mark this username as online in
  // Firebase and automatically clear it the moment the connection drops
  // (tab closed, network lost, etc.) so the green dot stays accurate ----
  const [onlineUsers, setOnlineUsers] = useState({});
  useEffect(() => {
    if (!me) return;
    let presenceRef = null, connectedRef = null, handler = null, cancelled = false;
    waitForFbdb().then(db => {
      if (cancelled) return;
      presenceRef = db.ref("presence/" + me.username);
      connectedRef = db.ref(".info/connected");
      handler = (snap) => {
        if (snap.val() === true) {
          presenceRef.onDisconnect().remove();
          presenceRef.set(true);
        }
      };
      connectedRef.on("value", handler);
    }).catch(e => console.error("presence setup failed", e));
    return () => {
      cancelled = true;
      if (connectedRef && handler) connectedRef.off("value", handler);
      if (presenceRef) presenceRef.remove();
    };
  }, [me && me.username]); // eslint-disable-line
  const isOnline = useCallback((username) => !!onlineUsers[username], [onlineUsers]);

  // ---- expiry sweep: group expiry is time-based (not triggered by any data
  // change), so it still needs its own lightweight periodic check ----
  const groupsRef = useRef(groups);
  const gamesRef = useRef(games);
  useEffect(() => { groupsRef.current = groups; }, [groups]);
  useEffect(() => { gamesRef.current = games; }, [games]);
  useEffect(() => {
    const iv = setInterval(async () => {
      const { groupUpdates, gameUpdates } = cleanExpiredGroups(groupsRef.current, gamesRef.current);
      const cleanupUpdates = { ...groupUpdates, ...gameUpdates };
      if (Object.keys(cleanupUpdates).length) await updatePaths(cleanupUpdates);
    }, 5000);
    return () => clearInterval(iv);
  }, []);

  // ---- phone/tarayıcı "geri" tuşu desteği: bu uygulama tek bir sayfa
  // (SPA) olduğu için ekranlar arasında normalde hiç tarayıcı geçmişi
  // (history) birikmiyordu. Bu yüzden telefonun geri tuşuna/kaydırma
  // hareketine basıldığında (özellikle lobide beklerken) tarayıcı/WebView
  // kendi varsayılan davranışını uyguluyor ve uygulamayı beklenmedik bir
  // duruma (uyarı ekranı, sayfa yenilenmesi vb.) sokuyordu. Bunu önlemek
  // için: alt bir ekrana her girildiğinde bir history kaydı ekliyoruz;
  // geri tuşuna basıldığında (popstate) tarayıcının sayfadan çıkmasına
  // izin vermek yerine, o ekranın kendi "geri" butonuyla aynı işlemi
  // (gerekirse lobiden çıkma gibi) biz tetikliyoruz. ----
  const screenRef = useRef(screen);
  useEffect(() => { screenRef.current = screen; }, [screen]);
  const activeGameIdRef = useRef(activeGameId);
  useEffect(() => { activeGameIdRef.current = activeGameId; }, [activeGameId]);
  const TOP_LEVEL_SCREENS = ["auth", "menu"];
  useEffect(() => {
    if (!TOP_LEVEL_SCREENS.includes(screen)) {
      window.history.pushState({ ktScreen: screen }, "");
    }
    // eslint-disable-next-line
  }, [screen]);
  useEffect(() => {
    function onPopState() {
      const cur = screenRef.current;
      if (cur === "lobby") {
        const game = gamesRef.current[activeGameIdRef.current];
        if (game && game.status === "lobby") {
          // lobide bekleme ekranındaysa, geri tuşu "Lobiden Çık" ile aynı
          // işlemi yapar (grubu/oyunu bozuk bir durumda bırakmadan)
          leaveLobby(activeGameIdRef.current);
        } else {
          setScreen("chat");
        }
      } else if (cur === "chat") {
        setScreen("groups");
      } else if (["groups", "solo", "leaderboard", "notifications", "admin"].includes(cur)) {
        setScreen("menu");
      }
      // "menu"/"auth" ekranındaysak hiçbir şey yapmıyoruz; telefonun
      // varsayılan geri davranışı (uygulamadan çıkma) devreye girer.
    }
    window.addEventListener("popstate", onPopState);
    return () => window.removeEventListener("popstate", onPopState);
    // eslint-disable-next-line
  }, []);

  // keep `me` synced with latest users store (for score updates elsewhere)
  useEffect(() => {
    if (me && users[me.username]) {
      const fresh = users[me.username];
      const newMedals = medalsForScore(fresh.score);
      if (newMedals.length > (me.medals || []).length) {
        const justEarned = newMedals[newMedals.length - 1];
        const tier = MEDAL_TIERS.find(m => m.key === justEarned);
        setMedalPopup(tier);
      }
      setMe({ username: me.username, isAdmin: fresh.isAdmin, score: fresh.score, medals: newMedals });
    }
  }, [users]); // eslint-disable-line

  // ---------------- AUTH ----------------
  // Google sign-in is now a mandatory first security step for EVERY user,
  // not just the admin. Anyone can sign in with any Google account here —
  // this step by itself does not grant admin access. After this succeeds,
  // the normal rumuz (username) + şifre (password) login/register flow
  // continues exactly as before. Only if the Google account used here is
  // the exact ADMIN_GOOGLE_EMAIL does the resulting account get the admin
  // panel button — regardless of which username/password was used.
  async function handleGoogleAdminVerify() {
    setGoogleAdminError("");
    setGoogleAdminBusy(true);
    try {
      const result = await window.__fbauth.signInWithPopup(window.__googleProvider);
      const email = (result.user && result.user.email || "").toLowerCase();
      setGoogleAdminVerified(true);
      setGoogleAdminEmail(email);
    } catch (e) {
      console.error("Google sign-in failed", e);
      setGoogleAdminError(t.googleAdminFailed);
    }
    setGoogleAdminBusy(false);
  }

  async function handleAuth() {
    setAuthError("");
    const uname = authForm.username.trim();
    const pass = authForm.password;
    if (!uname || !pass) { setAuthError(t.fillFields); return; }
    // Safety net: the UI already hides this form until Google sign-in is
    // done, but double-check here too.
    if (!googleAdminVerified) { setAuthError(t.googleAdminRequired); return; }
    const isAdminGoogle = (googleAdminEmail || "") === ADMIN_GOOGLE_EMAIL.toLowerCase();
    const { u } = await refreshAll();
    if (authMode === "login") {
      const rec = u[uname];
      if (!rec || rec.password !== pass) { setAuthError(t.wrongLogin); return; }
      // Admin panel visibility is driven purely by which Google account was
      // used above, so we always resync it to the current Google identity.
      const nu = { ...u, [uname]: { ...rec, isAdmin: isAdminGoogle } };
      await saveShared("users", nu); setUsers(nu);
      setMe({ username: uname, isAdmin: isAdminGoogle, score: rec.score || 0, medals: medalsForScore(rec.score || 0) });
      setScreen("menu");
      localStorage.setItem("kt_session", JSON.stringify({ username: uname, googleAdminEmail }));
    } else {
      if (u[uname]) { setAuthError(t.userExists); return; }
      const rec = { password: pass, score: 0, isAdmin: isAdminGoogle };
      const nu = { ...u, [uname]: rec };
      await saveShared("users", nu); setUsers(nu);
      setMe({ username: uname, isAdmin: isAdminGoogle, score: 0, medals: [] });
      setScreen("menu");
      localStorage.setItem("kt_session", JSON.stringify({ username: uname, googleAdminEmail }));
    }
  }

  function logout() {
    setMe(null); setScreen("auth"); setAuthForm({ username: "", password: "" });
    setGoogleAdminVerified(false); setGoogleAdminEmail(null); setGoogleAdminError("");
    if (window.__fbauth.currentUser) window.__fbauth.signOut().catch(() => {});
    localStorage.removeItem("kt_session");
  }

  // ---- üyeliği tamamen sil: kullanıcı kaydı, kurucusu olduğu gruplar (ve
  // onlara ait maçlar), sadece üye olduğu gruplardaki/maçlardaki üyeliği,
  // bildirimleri ve çevrimiçi durumu — her yerden kalıcı olarak kaldırılır.
  // Diğer gruplar/maçlar/kullanıcılar hiç etkilenmez. ----
  async function deleteAccountFn() {
    const username = me.username;
    const [g0, gm0] = await Promise.all([
      loadShared("groups", {}),
      loadShared("games", {}),
    ]);

    const updates = {};
    const nextGroups = { ...g0 };
    const nextGames = { ...gm0 };

    // 1) Kurucusu olduğu her grup, ona ait tüm maçlarla birlikte tamamen silinir.
    for (const [gid, grp] of Object.entries(g0)) {
      if (grp.owner === username) {
        updates["groups/" + gid] = null;
        delete nextGroups[gid];
        for (const [mgid, game] of Object.entries(gm0)) {
          if (game.groupId === gid && nextGames[mgid] !== undefined) {
            updates["games/" + mgid] = null;
            delete nextGames[mgid];
          }
        }
      }
    }

    // 2) Sadece üyesi olduğu (kurucusu olmadığı) gruplardan ismi çıkarılır.
    for (const [gid, grp] of Object.entries(nextGroups)) {
      if (grp.owner !== username && grp.members.includes(username)) {
        const newMembers = grp.members.filter(m => m !== username);
        updates["groups/" + gid + "/members"] = newMembers;
        nextGroups[gid] = { ...grp, members: newMembers };
      }
    }

    // 3) Kalan (silinmemiş) gruplara ait maçlarda da üye listesinden çıkarılır;
    // kendisiyle birlikte kimse kalmıyorsa maç tamamen silinir.
    for (const [gid, game] of Object.entries(nextGames)) {
      if (!game.members.includes(username)) continue;
      const newMembers = game.members.filter(m => m !== username);
      if (newMembers.length === 0) {
        updates["games/" + gid] = null;
        delete nextGames[gid];
        continue;
      }
      const newTurnIndex = (game.turnIndex || 0) % newMembers.length;
      updates["games/" + gid + "/members"] = newMembers;
      updates["games/" + gid + "/turnIndex"] = newTurnIndex;
      const updatedGame = { ...game, members: newMembers, turnIndex: newTurnIndex };
      if (game.host === username) { updates["games/" + gid + "/host"] = newMembers[0]; updatedGame.host = newMembers[0]; }
      nextGames[gid] = updatedGame;
    }

    // 4) Bildirimler, çevrimiçi durum ve kullanıcı kaydı tamamen silinir.
    updates["notifications/" + username] = null;
    updates["presence/" + username] = null;
    updates["users/" + username] = null;

    await updatePaths(updates);
    setGroups(nextGroups);
    setGames(nextGames);
    setUsers(prev => { const nu = { ...prev }; delete nu[username]; return nu; });

    logout();
  }

  async function adjustScore(username, delta) {
    const nu = { ...users, [username]: { ...users[username], score: Math.max(0, (users[username].score || 0) + delta) } };
    setUsers(nu); await saveShared("users", nu);
  }

  // admin panel: set a user's score to the EXACT number typed in the box
  async function setScoreExact(username, value) {
    const val = Math.max(0, Math.floor(value));
    const nu = { ...users, [username]: { ...users[username], score: val } };
    setUsers(nu); await saveShared("users", nu);
  }

  async function addPoints(username, delta) {
    // atomic per-user update: two group games finishing a word at the same
    // moment (very common — several matches can run in parallel) used to
    // both read the whole "users" tree and overwrite it in turn, silently
    // dropping one of the two point awards.
    await transactRecord("users/" + username, current => {
      const rec = current || { password: "", score: 0, isAdmin: false };
      return { ...rec, score: (rec.score || 0) + delta };
    });
  }

  // ---------------- GROUPS ----------------
  async function createGroup() {
    if (!newGroupName.trim()) return;
    const myGroupCount = Object.values(groups).filter(g => g.members.includes(me.username)).length;
    if (myGroupCount >= 50) { alert(t.groupLimitReached); return; }

    const today = new Date().toISOString().slice(0, 10);
    // atomic per-user check-and-increment: two "create group" taps landing
    // in the same instant no longer race on a shared read of the whole
    // "users" tree
    let limitHit = false;
    const freshUserRec = await transactRecord("users/" + me.username, current => {
      const rec = current || { password: "", score: 0, isAdmin: false };
      const countToday = rec.groupsCreatedDate === today ? (rec.groupsCreatedCount || 0) : 0;
      if (countToday >= 3) { limitHit = true; return; } // abort
      return { ...rec, groupsCreatedDate: today, groupsCreatedCount: countToday + 1 };
    });
    if (limitHit) { alert(t.dailyGroupLimit); return; }
    if (freshUserRec) setUsers(prev => ({ ...prev, [me.username]: freshUserRec }));

    const id = uid();
    const now = Date.now();
    const g = { id, name: newGroupName.trim(), owner: me.username, members: [me.username], messages: [], createdAt: now, usedMs: 0, activeSince: null, periodStart: getGroupPeriodStart(now), pendingDelete: false };
    // brand-new id, so a plain scoped set is safe — nothing else can already
    // be writing to this path
    await (await waitForFbdb()).ref("groups/" + id).set(g);
    setGroups(prev => ({ ...prev, [id]: g }));

    setNewGroupName(""); setShowCreateGroup(false);
    setActiveGroupId(id); setScreen("chat");
  }

  async function inviteToGroup(groupId, username) {
    const g = groups[groupId];
    if (!g || g.members.includes(username)) return;
    await transactRecord("notifications/" + username, current => {
      const userNotifs = current || [];
      return [...userNotifs, { id: uid(), type: "groupInvite", from: me.username, groupId, groupName: g.name, ts: Date.now() }];
    });
    alert(`${username} — ${t.invite} ✓`);
  }

  async function kickFromGroup(groupId, username) {
    await transactRecord("groups/" + groupId, current => {
      if (!current || current.owner !== me.username || username === current.owner) return current;
      return { ...current, members: current.members.filter(m => m !== username) };
    });
  }

  async function leaveGroupFn(groupId) {
    const grp = groups[groupId];
    if (!grp) { setActiveGroupId(null); setScreen("groups"); return; }
    if (grp.owner === me.username) { await deleteGroupFn(groupId); return; }
    await transactRecord("groups/" + groupId, current => {
      if (!current) return current;
      return { ...current, members: current.members.filter(m => m !== me.username) };
    });
    setActiveGroupId(null); setScreen("groups");
  }

  async function deleteGroupFn(groupId) {
    // scoped delete: only this one group's record is removed, every other
    // group is left completely untouched
    await (await waitForFbdb()).ref("groups/" + groupId).remove();
    const gm = await loadShared("games", {});
    const ng = { ...gm };
    const deletions = {};
    for (const [gid, game] of Object.entries(gm)) {
      if (game.groupId === groupId) { delete ng[gid]; deletions["games/" + gid] = null; }
    }
    if (Object.keys(deletions).length) { await updatePaths(deletions); setGames(ng); }
    setActiveGroupId(null); setScreen("groups");
  }

  async function acceptGroupInvite(notif) {
    const grp = await transactRecord("groups/" + notif.groupId, current => {
      if (!current) return current;
      if (current.members.includes(me.username)) return current;
      return { ...current, members: [...current.members, me.username] };
    });
    await removeNotification(notif.id);
    if (grp) { setActiveGroupId(notif.groupId); setScreen("chat"); }
  }

  async function removeNotification(id) {
    const mine = await transactRecord("notifications/" + me.username, current => {
      return (current || []).filter(n => n.id !== id);
    });
    setMyNotifs(mine || []);
  }

  // notifications/ tüm kullanıcılar için tek bir yerde tutulur; burada canlı
  // (real-time) dinlenip sadece bana ait olan alt küme türetilir. Böylece
  // hangi ekranda olursam olayım (menüde bile) yeni bir bildirim geldiği an
  // zil ikonundaki yeşil nokta anında görünür/kaybolur.
  const [allNotifs, setAllNotifs] = useState({});
  const [myNotifs, setMyNotifs] = useState([]);
  useEffect(() => {
    if (me) setMyNotifs(allNotifs[me.username] || []);
    else setMyNotifs([]);
  }, [allNotifs, me]);
  useEffect(() => {
    if (me) loadShared("notifications", {}).then(n => setAllNotifs(n || {}));
  }, [me && me.username]); // eslint-disable-line

  // ---------------- CHAT / GAME INVITE ----------------
  const [chatInput, setChatInput] = useState("");
  async function sendMessage(groupId) {
    if (!chatInput.trim()) return;
    const text = chatInput.trim();
    setChatInput("");
    await transactRecord("groups/" + groupId, current => {
      if (!current) return current;
      const messages = current.messages || [];
      return { ...current, messages: [...messages, { id: uid(), from: me.username, type: "text", text, ts: Date.now() }] };
    });
  }

  async function sendGameInvite(groupId) {
    const grpForLimit = groups[groupId];
    const remainingForLimit = groupRemainingMs(grpForLimit, games, Date.now());
    if (remainingForLimit !== null && remainingForLimit <= 0) {
      alert(isGroupResetToday(Date.now()) ? t.dailyPlayLimitToday : t.dailyPlayLimitTomorrow);
      return;
    }
    const gameId = uid();
    const newGame = {
      id: gameId, groupId, host: me.username, lang, status: "lobby",
      members: [me.username], maxMembers: 15,
      currentLetter: null, turnIndex: 0, roundNumber: 0,
      wordChain: [], lastResults: [], spinToken: 0,
      activeMembers: [me.username], eliminatedPlayers: {}, lastElimination: null, elimSeq: 0,
    };
    const grp = await transactRecord("groups/" + groupId, current => {
      if (!current) return current;
      const messages = current.messages || [];
      return { ...current, messages: [...messages, { id: uid(), from: me.username, type: "invite", gameId, ts: Date.now() }] };
    });
    if (!grp) { alert(t.groupGone); return; }
    // Only this brand-new game record is touched — other games in flight
    // elsewhere are left alone.
    await (await waitForFbdb()).ref("games/" + gameId).set(newGame);
    setGames(prev => ({ ...prev, [gameId]: newGame }));
    setActiveGameId(gameId); setScreen("lobby");
  }

  async function joinLobby(gameId) {
    let full = false;
    const game = await transactRecord("games/" + gameId, current => {
      if (!current) return; // abort — this game no longer exists
      if (current.members.includes(me.username)) return current;
      if (current.members.length >= current.maxMembers) { full = true; return; } // abort transaction
      return { ...current, members: [...current.members, me.username] };
    });
    if (!game) { if (full) alert(t.lobbyFull); return; }
    setActiveGameId(gameId); setScreen("lobby");
  }

  async function leaveLobby(gameId) {
    let empty = false;
    await transactRecord("games/" + gameId, current => {
      if (!current) return current;
      const nextMembers = current.members.filter(m => m !== me.username);
      empty = nextMembers.length === 0;
      return { ...current, members: nextMembers };
    });
    // Boş kalan (kimsenin bulunmadığı) lobiyi ortada bırakmamak için siliyoruz.
    if (empty) { await (await waitForFbdb()).ref("games/" + gameId).remove().catch(() => {}); }
    setScreen("chat");
  }

  async function startSpin(gameId) {
    const gForLimit = games[gameId] && groups[games[gameId].groupId];
    const remainingForLimit = gForLimit ? groupRemainingMs(gForLimit, games, Date.now()) : null;
    if (remainingForLimit !== null && remainingForLimit <= 0) {
      alert(isGroupResetToday(Date.now()) ? t.dailyPlayLimitToday : t.dailyPlayLimitTomorrow);
      return;
    }
    await transactRecord("games/" + gameId, current => {
      if (!current) return current;
      const letters = ALPHABETS[current.lang].filter(l => current.lang === "tr" ? l !== "Ğ" : true);
      const pick = letters[Math.floor(Math.random() * letters.length)];
      return {
        ...current,
        status: "spinning",
        currentLetter: pick,
        spinToken: (current.spinToken || 0) + 1,
        turnIndex: 0,
        wordChain: [],
        roundNumber: (current.roundNumber || 0) + 1,
        // yeni tur: herkes yeniden aktif, önceki turdan kalan elenme
        // bilgileri temizlenir
        activeMembers: [...current.members],
        eliminatedPlayers: {},
        lastElimination: null,
      };
    });
  }

  async function finishSpin(gameId, expectedToken) {
    await transactRecord("games/" + gameId, current => {
      if (!current) return current;
      // guard: ignore a stale onSpinEnd firing from an old animation that
      // finishes late (e.g. a laggy client) after the round has already
      // moved on to a newer spin
      if (expectedToken !== undefined && current.spinToken !== expectedToken) return current;
      if (current.status !== "spinning") return current;
      return { ...current, status: "playing" };
    });
  }

  async function submitWord(gameId, word, isValid, timedOut) {
    // Grup maçları artık 25 kelimede bitmiyor: bir oyuncu yanlış/geçersiz bir
    // kelime yazana, daha önce kullanılmış bir kelimeyi tekrar yazana ya da
    // süresini geçirene kadar oyun sürer — o oyuncu tek başına elenir, diğer
    // oyuncular oynamaya devam eder. Sadece bir kişi kalana kadar bu böyle
    // gider; son kalan oyuncu, o tur boyunca toplanan tüm puanları (varsa
    // +20 hepsi-doğru bonusuyla birlikte) tek başına kazanır.
    let payout = null; // { username, amount }
    const game = await transactRecord("games/" + gameId, current => {
      if (!current) return current;
      payout = null;

      const activeMembers = (current.activeMembers && current.activeMembers.length) ? current.activeMembers : current.members;
      const turnIdx = current.turnIndex % activeMembers.length;
      const actingPlayer = activeMembers[turnIdx];
      const wordChain = current.wordChain || [];

      let isElim = false, reason = null, trimmed = "";
      if (timedOut) {
        isElim = true; reason = "timeout";
      } else {
        trimmed = word.trim();
        const isDuplicate = trimmed && wordChain.some(
          w => w.word && normalizeWord(w.word, current.lang) === normalizeWord(trimmed, current.lang)
        );
        if (isDuplicate) { isElim = true; reason = "duplicate"; }
        else if (!isValid || !trimmed) { isElim = true; reason = "invalid"; }
      }

      const points = (!isElim && isValid && trimmed) ? POINTS_PER_WORD : 0;
      const nextChain = [...wordChain, { username: actingPlayer, word: trimmed, points }];

      if (!isElim) {
        // doğru cevap: sıradaki aktif oyuncuya geç, kimse elenmedi
        return { ...current, wordChain: nextChain, turnIndex: (turnIdx + 1) % activeMembers.length };
      }

      // birisi elendi
      const remaining = activeMembers.filter(m => m !== actingPlayer);
      const eliminatedPlayers = { ...(current.eliminatedPlayers || {}) };
      eliminatedPlayers[actingPlayer] = { word: trimmed, reason };
      const elimSeq = (current.elimSeq || 0) + 1;
      const lastElimination = { username: actingPlayer, word: trimmed, reason, seq: elimSeq };

      if (remaining.length <= 1) {
        // tur bitti: geriye kalan tek kişi (varsa) kazanır. Hepsi-doğru
        // bonusu, elenme anına kadarki her kelimenin doğru olup olmadığına
        // bakılarak hesaplanır (elenme kaydının kendisi hariç).
        const winner = remaining[0] || null;
        const preElim = nextChain.slice(0, -1);
        const allCorrect = preElim.length > 0 && preElim.every(w => w.points > 0);
        const teamPoints = nextChain.reduce((s, w) => s + w.points, 0) + (allCorrect ? STREAK_BONUS : 0);
        if (winner) payout = { username: winner, amount: teamPoints };
        return {
          ...current, wordChain: nextChain, status: "results", lastResults: nextChain,
          roundWinner: winner, roundPool: winner ? teamPoints : 0,
          activeMembers: remaining, eliminatedPlayers, lastElimination, elimSeq,
        };
      }

      // oyun devam ediyor: elenen oyuncu aktif listeden çıkarılır, sıra
      // listede onun yerini alan (bir sonraki) oyuncuya geçer
      const elimIdx = activeMembers.indexOf(actingPlayer);
      const newTurnIndex = remaining.length ? (elimIdx % remaining.length) : 0;
      return {
        ...current, wordChain: nextChain, activeMembers: remaining, turnIndex: newTurnIndex,
        eliminatedPlayers, lastElimination, elimSeq,
      };
    });
    if (!game) return;
    if (payout && payout.amount > 0) await addPoints(payout.username, payout.amount);
