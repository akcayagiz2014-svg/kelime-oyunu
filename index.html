          </div>
          <div className="flex flex-col items-end gap-1">
            <button onClick={() => sendGameInvite(activeGroupId)} className="flex items-center gap-1 px-3 py-2 rounded-full text-xs font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>
              <Swords size={14} /> {t.sendRequest}
            </button>
            {remaining != null && (
              <span className="flex items-center gap-1 text-[10px] font-semibold" style={{ color: remaining <= 0 ? "#ff8a8a" : remaining < 5 * 60 * 1000 ? "#ffb84d" : "rgba(255,255,255,0.4)" }}>
                <Clock size={10} /> {remaining > 0 ? formatRemaining(remaining) : t.dailyPlayLimitShort}
              </span>
            )}
          </div>
        </div>

        <div className="max-w-md w-full mx-auto flex flex-wrap gap-1.5 mb-3">
          {(grp.members || []).map(m => (
            <span key={m} className="flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-white/10 text-white">
              {m === grp.owner && <Crown size={10} color="#f2b705" />} {m} <OnlineDot online={isOnline(m)} />
              {isOwner && m !== grp.owner && (
                <button onClick={() => { if (window.confirm(`${m} ${t.kickConfirm}`)) kickFromGroup(activeGroupId, m); }}
                  className="ml-0.5 w-4 h-4 rounded-full flex items-center justify-center bg-red-500/70 hover:bg-red-500 text-white" title={t.kickMember}>
                  <X size={9} />
                </button>
              )}
            </span>
          ))}
        </div>

        <div className="flex-1 space-y-2 overflow-y-auto mb-3 max-w-md w-full mx-auto" style={{ maxHeight: "60vh" }}>
          {/* Oyun daveti balonları gönderildikten 30 saniye sonra sohbetten
              otomatik kaybolur (metin mesajları kalıcı kalmaya devam eder).
              `tick` her saniye güncellendiği için bu filtre otomatik olarak
              yeniden hesaplanır, ayrıca sayfayı yenilemeye gerek kalmaz. */}
          {(grp.messages || []).filter(m => m.type !== "invite" || (tick - m.ts) < 30000).map(m => (
            <div key={m.id} className={`max-w-[80%] ${m.from === me.username ? "ml-auto" : ""}`}>
              {m.type === "text" ? (
                <div className={`px-4 py-2 rounded-2xl text-sm ${m.from === me.username ? "bg-yellow-500 text-[#1b1030]" : "bg-white/10 text-white"}`}>
                  <p className="text-[10px] opacity-60 font-semibold flex items-center gap-1">{m.from === me.username ? t.you : m.from} <OnlineDot online={isOnline(m.from)} /></p>
                  {m.text}
                </div>
              ) : (
                <button onClick={() => joinLobby(m.gameId)} className="w-full px-4 py-3 rounded-2xl text-left border-2 border-dashed border-yellow-400/60 bg-yellow-400/10 hover:bg-yellow-400/20">
                  <p className="text-yellow-300 text-xs font-bold flex items-center gap-1"><Swords size={14} /> {m.from} <OnlineDot online={isOnline(m.from)} /> {t.gameInviteText}</p>
                </button>
              )}
            </div>
          ))}
          {(grp.messages || []).filter(m => m.type !== "invite" || (tick - m.ts) < 30000).length === 0 && <p className="text-white/40 text-center text-sm mt-8">…</p>}
        </div>

        <div className="max-w-md w-full mx-auto flex gap-2">
          <input value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyDown={e => e.key === "Enter" && sendMessage(activeGroupId)}
            placeholder={t.writeMessage} className="flex-1 px-4 py-3 rounded-full bg-white/10 text-white placeholder-white/40 outline-none" />
          <button onClick={() => sendMessage(activeGroupId)} className="p-3 rounded-full" style={{ background: "#f2b705" }}><Send size={18} color="#1b1030" /></button>
        </div>

        {showGroupInvite && isOwner && (
          <Modal onClose={() => setShowGroupInvite(false)}>
            <h3 className="text-white font-bold mb-3" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.groupCallBtn}</h3>
            <input value={groupInviteSearch} onChange={e => setGroupInviteSearch(e.target.value)} placeholder={t.searchUser}
              className="w-full px-4 py-3 rounded-xl bg-white/10 text-white placeholder-white/40 outline-none mb-3" autoFocus />
            <div className="space-y-1.5 overflow-y-auto" style={{ maxHeight: "50vh" }}>
              {filteredUsers.length === 0 && <p className="text-white/40 text-sm text-center py-4">{t.noUserFound}</p>}
              {filteredUsers.map(u => {
                const already = grp.members.includes(u);
                return (
                  <div key={u} className="flex items-center justify-between px-3 py-2.5 rounded-xl bg-white/10">
                    <span className="text-white text-sm font-semibold flex items-center gap-1.5">{u} <OnlineDot online={isOnline(u)} /></span>
                    <button disabled={already} onClick={() => inviteToGroup(activeGroupId, u)}
                      className="px-3 py-1.5 rounded-full text-xs font-bold disabled:opacity-40"
                      style={{ background: already ? "rgba(255,255,255,0.1)" : "#f2b705", color: already ? "#fff" : "#1b1030" }}>
                      {already ? t.alreadyMember : t.invite}
                    </button>
                  </div>
                );
              })}
            </div>
            <button onClick={() => setShowGroupInvite(false)} className="w-full mt-3 py-2.5 rounded-xl bg-white/10 text-white">{t.close}</button>
          </Modal>
        )}
      </div>
    );
  }

  // ---------------- LOBBY ----------------
  if (screen === "lobby" && activeGameId) {
    const game = games[activeGameId];
    if (!game) {
      return <GoneScreen bg={bg} message={t.groupGone} backLabel={t.back} onBack={() => setScreen("groups")} />;
    }
    if (game.status !== "lobby") {
      return <GroupGameView game={game} me={me} t={t} onSpinEnd={(token) => finishSpin(activeGameId, token)}
        onSubmitWord={(w, ok, timedOut) => submitWord(activeGameId, w, ok, timedOut)}
        onNextRound={() => backToWheelScreen(activeGameId)}
        onExitToChat={() => setScreen("chat")} onGameOver={() => setScreen("menu")} lang={game.lang} onlineUsers={onlineUsers} />;
    }
    const grp = groups[game.groupId];
    // Çarkı sadece grubu kuran kişi çevirebilir (host değil, grup sahibi) —
    // böylece çark kimsenin beklemediği bir anda "rastgele" dönmez, yalnızca
    // grubun kurucusu bilerek bastığında döner.
    const isOwner = !!grp && grp.owner === me.username;
    return (
      <div className="min-h-screen w-full p-5 flex flex-col items-center" style={{ fontFamily: "Inter, sans-serif" }}>
        {bg}
        <button onClick={() => leaveLobby(activeGameId)} className="absolute top-5 left-5 p-2 rounded-full bg-white/10 text-white">
          <ArrowLeft size={18} />
        </button>
        <div className="mt-16 text-center mb-6">
          <h2 className="text-xl font-bold text-white" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.lobby}</h2>
          <p className="text-white/50 text-sm">{game.members.length}/{game.maxMembers} · {t.waitingPlayers}</p>
        </div>
        <div className="flex flex-wrap gap-2 justify-center max-w-md mb-8">
          {game.members.map(m => (
            <div key={m} className="px-3 py-2 rounded-full bg-white/10 text-white text-sm flex items-center gap-1">
              {!!grp && m === grp.owner && <Crown size={12} color="#f2b705" />} {m} <OnlineDot online={isOnline(m)} />
            </div>
          ))}
        </div>
        {isOwner && (
          <button onClick={() => startSpin(activeGameId)} className="px-8 py-4 rounded-full font-bold text-lg flex items-center gap-2" style={{ background: "#f2b705", color: "#1b1030", fontFamily: "Fredoka, sans-serif" }}>
            <Play size={20} /> {t.startGame}
          </button>
        )}
        {!isOwner && <p className="text-white/40 text-sm">{t.onlyOwnerCanSpin}</p>}
      </div>
    );
  }

  // ---------------- SOLO ----------------
  if (screen === "solo") {
    return <SoloGameView t={t} lang={lang} me={me} onAddPoints={(d) => addPoints(me.username, d)} onExit={() => setScreen("menu")} />;
  }

  // ---------------- LEADERBOARD ----------------
  if (screen === "leaderboard") {
    const sorted = Object.entries(users).sort((a, b) => (b[1].score || 0) - (a[1].score || 0));
    return (
      <div className="min-h-screen w-full p-5" style={{ fontFamily: "Inter, sans-serif" }}>
        {bg}
        {Header(t.worldLeaderboard, true)}
        <div className="max-w-md mx-auto space-y-2">
          {sorted.map(([name, rec], i) => {
            const mkeys = medalsForScore(rec.score || 0);
            return (
              <div key={name} className="flex items-center justify-between px-4 py-3 rounded-2xl bg-white/10">
                <div className="flex items-center gap-3">
                  <span className="w-6 text-center font-bold" style={{ color: i === 0 ? "#f2b705" : i === 1 ? "#c9c9d6" : i === 2 ? "#c17a4a" : "#ffffff80" }}>{i + 1}</span>
                  <span className="text-white font-semibold flex items-center gap-1.5">{name} <OnlineDot online={isOnline(name)} /></span>
                  {mkeys.map(mk => { const tier = MEDAL_TIERS.find(x => x.key === mk); const Icon = tier.icon; return <Icon key={mk} size={14} color={tier.color} />; })}
                </div>
                <span className="text-yellow-400 font-bold">{rec.score || 0}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ---------------- NOTIFICATIONS ----------------
  if (screen === "notifications") {
    return (
      <div className="min-h-screen w-full p-5" style={{ fontFamily: "Inter, sans-serif" }}>
        {bg}
        {Header(t.notifications, true)}
        <div className="max-w-md mx-auto space-y-2">
          {myNotifs.length === 0 && <p className="text-white/40 text-center mt-10">{t.noNotifications}</p>}
          {myNotifs.map(n => (
            <div key={n.id} className="px-4 py-3 rounded-2xl bg-white/10">
              <p className="text-white text-sm mb-2 flex items-center gap-1.5 flex-wrap"><b className="flex items-center gap-1">{n.from} <OnlineDot online={isOnline(n.from)} /></b> {t.invitedYouToGroup}: <b>{n.groupName}</b></p>
              <div className="flex gap-2">
                <button onClick={() => acceptGroupInvite(n)} className="flex-1 py-1.5 rounded-full text-xs font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>{t.accept}</button>
                <button onClick={() => removeNotification(n.id)} className="flex-1 py-1.5 rounded-full text-xs font-bold bg-white/10 text-white">{t.decline}</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ---------------- ADMIN ----------------
  if (screen === "admin" && me.isAdmin && googleAdminVerified) {
    return (
      <div className="min-h-screen w-full p-5" style={{ fontFamily: "Inter, sans-serif" }}>
        {bg}
        {Header(t.admin, true)}
        <p className="text-white/50 text-sm mb-4 max-w-md mx-auto">{t.adminPanelDesc}</p>
        <div className="max-w-md mx-auto space-y-2">
          {Object.entries(users).map(([name, rec]) => {
            return (
              <div key={name} className="flex items-center justify-between px-4 py-3 rounded-2xl bg-white/10">
                <div>
                  <p className="text-white font-semibold flex items-center gap-1.5">{name} <OnlineDot online={isOnline(name)} /> {rec.isAdmin && <Shield size={12} className="inline text-purple-300 ml-1" />}</p>
                  <p className="text-yellow-400 text-sm font-bold">{rec.score || 0}</p>
                </div>
                <div className="flex gap-1 items-center">
                  <input
                    type="number"
                    inputMode="numeric"
                    value={scoreInputs[name] !== undefined ? scoreInputs[name] : ""}
                    onChange={e => setScoreInputs(prev => ({ ...prev, [name]: e.target.value }))}
                    onKeyDown={e => {
                      if (e.key === "Enter") {
                        e.preventDefault();
                        const v = parseInt(scoreInputs[name], 10);
                        if (!isNaN(v)) { setScoreExact(name, v); setScoreInputs(prev => ({ ...prev, [name]: "" })); }
                      }
                    }}
                    placeholder={String(rec.score || 0)}
                    className="w-20 px-2 py-1.5 rounded-full bg-white/10 text-white text-xs text-center outline-none border border-white/20"
                  />
                  <button
                    onClick={() => {
                      const v = parseInt(scoreInputs[name], 10);
                      if (!isNaN(v)) { setScoreExact(name, v); setScoreInputs(prev => ({ ...prev, [name]: "" })); }
                    }}
                    className="px-3 py-1.5 rounded-full bg-yellow-500/80 text-[#1b1030] text-xs font-bold">
                    {t.setScore}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ---------------- ADMIN SPECTATE ----------------
  if (screen === "adminSpectate" && me.isAdmin && googleAdminVerified) {
    const game = games[adminSpectateGameId];
    if (!game) {
      return <GoneScreen bg={bg} message={t.groupGone} backLabel={t.back} onBack={() => setScreen("admin")} />;
    }
    return <GroupGameView game={game} me={me} t={t} lang={game.lang} isSpectator
      onSpinEnd={(token) => finishSpin(adminSpectateGameId, token)}
      onSubmitWord={() => {}}
      onNextRound={() => setScreen("admin")}
      onExitToChat={() => setScreen("admin")} onGameOver={() => setScreen("admin")} onlineUsers={onlineUsers} />;
  }

  return null;
}

// =========================================================
// GROUP GAME VIEW (wheel + relay chain for a lobby's round)
// =========================================================
function GroupGameView({ game, me, t, onSpinEnd, onSubmitWord, onNextRound, onExitToChat, onGameOver, lang, isSpectator, onlineUsers = {} }) {
  const [wordInput, setWordInput] = useState("");
  const [timeLeft, setTimeLeft] = useState(WORD_TIME_SECONDS);
  const [checking, setChecking] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [shake, setShake] = useState(false);
  const [flash, setFlash] = useState(null);
  const [watching, setWatching] = useState(false); // elenen bir oyuncu "Maçı İzle" dediyse true
  const [elimToast, setElimToast] = useState(null);
  const feedbackKeyRef = useRef(0);
  const timerRef = useRef(null);
  const feedbackTimeoutRef = useRef(null);
  const elimToastTimeoutRef = useRef(null);
  const wordInputRef = useRef(null);
  const members = game.members || [];
  const activeMembers = (game.activeMembers && game.activeMembers.length) ? game.activeMembers : members;
  const eliminatedPlayers = game.eliminatedPlayers || {};
  const wordChain = game.wordChain || [];
  const lastResults = game.lastResults || [];
  const currentPlayer = activeMembers[game.turnIndex % activeMembers.length];
  // Elenmiş bir oyuncu, izlemeyi seçmediği sürece artık "oyuncu" değil,
  // kendi elenme ekranını görür.
  const amEliminated = !isSpectator && !!eliminatedPlayers[me.username];
  const spectatorMode = isSpectator || (amEliminated && watching);
  const isMyTurn = !spectatorMode && !amEliminated && currentPlayer === me.username && game.status === "playing";
  const requiredLetter = wordChain.length === 0 ? game.currentLetter : lastLetter(wordChain[wordChain.length - 1].word, lang);

  // her yeni tur başladığında (yeniden çark çevrildiğinde) izleme durumu
  // sıfırlanır — kişi tekrar oynayan bir üye olarak başlar
  useEffect(() => { setWatching(false); }, [game.roundNumber]);

  // diğer oyunculara "biri elendi" bildirimi: kendi elenmemizi burada
  // ayrıca göstermiyoruz, çünkü o zaten tam ekran kendi ekranını görüyor
  useEffect(() => {
    const le = game.lastElimination;
    if (!le || le.username === me.username) return;
    clearTimeout(elimToastTimeoutRef.current);
    setElimToast(le);
    elimToastTimeoutRef.current = setTimeout(() => setElimToast(null), 2800);
    return () => clearTimeout(elimToastTimeoutRef.current);
  }, [game.lastElimination && game.lastElimination.seq]); // eslint-disable-line

  useEffect(() => {
    if (!isMyTurn) return;
    setTimeLeft(WORD_TIME_SECONDS);
    clearInterval(timerRef.current);
    timerRef.current = setInterval(() => {
      setTimeLeft(tl => {
        if (tl <= 1) { clearInterval(timerRef.current); handleSubmit(true); return 0; }
        return tl - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [isMyTurn, game.turnIndex]); // eslint-disable-line

  // Kelime giriş alanı her yeni kelimede kullanıcı tıklamadan otomatik
  // seçili (odaklı) hale gelsin. `autoFocus` sadece input ilk kez DOM'a
  // eklendiğinde çalışır; sıra tekrar aynı oyuncuya geldiğinde (input
  // yeniden mount edilmiyor) bu efekt her yeni kelimede odağı elle
  // tazeler. Not: bazı mobil tarayıcılar, kullanıcı dokunuşu olmadan
  // programatik odaklanmayla klavyeyi açmayı engelleyebilir; bu tarayıcı
  // kısıtı olup kod tarafından aşılamaz.
  useEffect(() => {
    if (isMyTurn) wordInputRef.current && wordInputRef.current.focus();
  }, [isMyTurn, wordChain.length]);

  useEffect(() => () => clearTimeout(feedbackTimeoutRef.current), []);

  function showFeedback(ok, word) {
    clearTimeout(feedbackTimeoutRef.current);
    setFeedback({ ok, word, key: ++feedbackKeyRef.current });
    if (!ok) { setShake(true); setTimeout(() => setShake(false), 420); }
    feedbackTimeoutRef.current = setTimeout(() => setFeedback(null), 1600);
  }

  async function handleSubmit(timedOut) {
    clearInterval(timerRef.current);
    const w = timedOut ? "" : wordInput.trim();
    setWordInput("");
    if (!w) { showFeedback(false, ""); setFlash({ ok: false, key: ++feedbackKeyRef.current }); onSubmitWord("", false, timedOut); return; }
    setChecking(true);
    const ok = await checkWordValid(w, lang, requiredLetter);
    setChecking(false);
    showFeedback(ok, w);
    setFlash({ ok, key: ++feedbackKeyRef.current });
    onSubmitWord(w, ok, false);
  }

  return (
    <div className="min-h-screen w-full p-5 flex flex-col items-center" style={{ fontFamily: "Inter, sans-serif" }}>
      <div className="fixed inset-0 -z-10" style={{ background: "radial-gradient(ellipse at 25% 15%, #2d1755 0%, #1c0f38 45%, #0f0a1e 100%)" }} />
      {flash && <FullScreenFlash key={flash.key} ok={flash.ok} onDone={() => setFlash(null)} />}
      <button onClick={onExitToChat} className="absolute top-5 left-5 p-2 rounded-full bg-white/10 text-white"><ArrowLeft size={18} /></button>
      {spectatorMode && (
        <span className="absolute top-5 right-5 flex items-center gap-1 px-3 py-2 rounded-full bg-purple-600/70 text-white text-xs font-bold">
          <Shield size={12} /> {t.spectating}
        </span>
      )}
      {elimToast && (
        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-center font-bold text-sm shadow-lg"
          style={{ background: "#ff6f61", color: "#1b1030", maxWidth: "88vw" }}>
          {elimToast.username}{elimToast.word ? `: "${elimToast.word}" — ` : " "}
          {elimToast.reason === "timeout" ? t.eliminatedByTimeout : elimToast.reason === "invalid" ? t.eliminatedByInvalid : t.eliminatedByDuplicate}
        </div>
      )}
      <p className="text-white/40 text-xs mt-14 mb-2">{t.roundOf} {game.roundNumber} · {wordChain.length} {t.roundOf.toLowerCase()} · {activeMembers.length} {t.playersLeft}</p>

      {game.status === "spinning" && (
        <div className="flex flex-col items-center mt-4">
          <Wheel lang={lang} spinning resultLetter={game.currentLetter} onSpinEnd={() => onSpinEnd(game.spinToken)} excludeFirst={lang === "tr" ? "Ğ" : null} />
        </div>
      )}

      {game.status === "playing" && amEliminated && !watching && (
        <div className="w-full max-w-sm mt-16 text-center">
          <div className="rounded-3xl p-7" style={{ background: "linear-gradient(160deg,#2c1750,#1b1030)", border: "2px solid #ff6f61" }}>
            <X size={40} color="#ff6f61" className="mx-auto mb-3" />
            <h2 className="text-xl font-bold text-white mb-2" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.eliminatedTitle}</h2>
            {eliminatedPlayers[me.username] && eliminatedPlayers[me.username].reason === "duplicate" && (
              <p className="text-white/80 mb-1"><b className="text-yellow-400">"{eliminatedPlayers[me.username].word}"</b></p>
            )}
            <p className="text-white/70 text-sm mb-5">
              {eliminatedPlayers[me.username] && eliminatedPlayers[me.username].reason === "duplicate" ? t.duplicateWordMsg
                : eliminatedPlayers[me.username] && eliminatedPlayers[me.username].reason === "timeout" ? t.eliminatedTimeoutMsg
                : t.eliminatedInvalidMsg}
            </p>
            <div className="flex flex-col gap-2">
              <button onClick={() => setWatching(true)} className="w-full py-2.5 rounded-full font-bold flex items-center justify-center gap-2" style={{ background: "#f2b705", color: "#1b1030" }}>
                <Shield size={16} /> {t.watchMatch}
              </button>
              <button onClick={onGameOver} className="w-full py-2.5 rounded-full font-bold" style={{ background: "#ff6f61", color: "#1b1030" }}>
                {t.backToMenu}
              </button>
            </div>
          </div>
        </div>
      )}

      {game.status === "playing" && (!amEliminated || watching) && (
        <div className="w-full max-w-sm mt-6">
          <div className="flex flex-wrap gap-2 justify-center mb-6">
            {members.map(m => {
              const isElim = !!eliminatedPlayers[m];
              const isTurn = !isElim && currentPlayer === m;
              return (
                <span key={m} className={`px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1 ${isTurn ? "bg-yellow-400 text-[#1b1030]" : isElim ? "bg-white/5 text-white/30 line-through" : "bg-white/10 text-white/60"}`}>{m} <OnlineDot online={!!onlineUsers[m]} /></span>
              );
            })}
          </div>
          {wordChain.length > 0 && (
            <div className="text-center mb-4 text-white/70 text-sm">
              {wordChain[wordChain.length - 1].username}: <b className="text-white">{wordChain[wordChain.length - 1].word || "—"}</b>
            </div>
          )}
          <div className="text-center mb-3">
            <p className="text-white/50 text-sm">{isMyTurn ? t.yourTurn : `${currentPlayer}...`}</p>
            <p className="text-white text-lg"><b className="text-yellow-400 text-2xl">{requiredLetter}</b> {t.writeWordStartingWith}</p>
          </div>
          <div className="mb-3 min-h-[44px] flex items-center justify-center">
            <WordFeedbackBadge feedback={feedback} t={t} />
          </div>
          {isMyTurn && (
            <>
              <div className="flex items-center justify-center gap-1 text-white/60 text-sm mb-2"><Clock size={14} /> {timeLeft}s</div>
              <div className="flex gap-2">
                <input ref={wordInputRef} autoFocus value={wordInput}
                  onChange={e => {
                    const v = e.target.value;
                    // Some mobile keyboards don't fire a proper "Enter" keydown event;
                    // instead they insert a literal newline into the text. Catch that
                    // here too so pressing the keyboard's send/enter key always submits.
                    if (v.includes("\n")) { handleSubmit(false); return; }
                    setWordInput(v);
                  }}
                  onKeyDown={e => e.key === "Enter" && handleSubmit(false)}
                  enterKeyHint="send" inputMode="text"
                  disabled={checking} className="flex-1 px-4 py-3 rounded-full bg-white/10 text-white outline-none border-2 border-yellow-400/40"
                  style={{ animation: shake ? "inputShake 420ms ease" : "none" }} />
                <button onClick={() => handleSubmit(false)} disabled={checking} className="px-5 py-3 rounded-full font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>
                  {checking ? t.checking : t.submit}
                </button>
              </div>
            </>
          )}
        </div>
      )}

      {game.status === "results" && (
        <div className="w-full max-w-sm mt-6">
          <h3 className="text-white font-bold text-center mb-1" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.roundResults}</h3>
          <p className="text-white/40 text-xs text-center mb-4">{lastResults.length} {t.roundOf.toLowerCase()}</p>

          {lastResults.length > 0 && lastResults.every(r => r.points > 0) && (
            <div className="mb-4 px-4 py-3 rounded-2xl text-center font-bold text-sm"
              style={{ background: "#f2b70522", border: "1px solid #f2b70566", color: "#f2b705" }}>
              🎉 {t.groupAllCorrectMsg}
            </div>
          )}

          {game.roundWinner && (
            <div className="mb-4 px-4 py-4 rounded-2xl text-center" style={{ background: "#f2b70522", border: "1px solid #f2b70566" }}>
              <p className="flex items-center justify-center gap-1 font-bold text-lg mb-1" style={{ color: "#f2b705", fontFamily: "Fredoka, sans-serif" }}>
                <Crown size={18} color="#f2b705" /> {t.roundWinnerLabel}: {game.roundWinner}
              </p>
              <p className="text-white/70 text-xs mb-2">{t.roundWinnerDesc}</p>
              <p className="text-yellow-400 font-black text-2xl">+{game.roundPool || 0} {t.points}</p>
            </div>
          )}

          {/* bu turdaki doğru/yanlış sayıları — puanların tamamı yukarıdaki galibe verildi */}
          <div className="flex flex-wrap gap-2 justify-center mb-4">
            {members.map(m => {
              const correct = lastResults.filter(r => r.username === m && r.points > 0).length;
              const wrong = lastResults.filter(r => r.username === m && r.points === 0).length;
              const isWinner = m === game.roundWinner;
              return (
                <span key={m} className={`px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 ${isWinner ? "text-[#1b1030]" : "bg-white/10 text-white"}`}
                  style={isWinner ? { background: "#f2b705" } : undefined}>
                  {isWinner && <Crown size={11} />} {m}: <span className={isWinner ? "" : "text-green-400"}>{correct}</span>/<span className={isWinner ? "" : "text-red-400"}>{wrong}</span> <OnlineDot online={!!onlineUsers[m]} />
                </span>
              );
            })}
          </div>

          <div className="space-y-2 mb-6 overflow-y-auto pr-1" style={{ maxHeight: "42vh" }}>
            {lastResults.map((r, i) => (
              <div key={i} className="flex items-center justify-between px-4 py-3 rounded-2xl bg-white/10">
                <span className="text-white">{r.username}: <b>{r.word || t.noWord}</b></span>
                <span className={`font-bold ${r.points > 0 ? "text-green-400" : "text-red-400"}`}>+{r.points} {t.points}</span>
              </div>
            ))}
          </div>
          <button onClick={spectatorMode ? onExitToChat : onNextRound} className="w-full py-3 rounded-full font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>{spectatorMode ? t.spectateBack : t.back}</button>
        </div>
      )}
    </div>
  );
}

// =========================================================
// SOLO GAME VIEW
// =========================================================
function SoloGameView({ t, lang, me, onAddPoints, onExit }) {
  const [status, setStatus] = useState("wheel"); // wheel, spinning, playing
  const [letter, setLetter] = useState(null);
  const [chain, setChain] = useState([]);
  const [wordInput, setWordInput] = useState("");
  const [checking, setChecking] = useState(false);
  const [feedback, setFeedback] = useState(null);
  const [shake, setShake] = useState(false);
  const [flash, setFlash] = useState(null);
  const [allCorrectMsg, setAllCorrectMsg] = useState(false);
  const [gameOverWord, setGameOverWord] = useState(null);
  const feedbackKeyRef = useRef(0);
  const [timeLeft, setTimeLeft] = useState(WORD_TIME_SECONDS);
  const timerRef = useRef(null);
  const wordInputRef = useRef(null);
  const required = chain.length === 0 ? letter : lastLetter(chain[chain.length - 1].word, lang);

  useEffect(() => {
    if (status !== "playing") return;
    setTimeLeft(WORD_TIME_SECONDS);
    clearInterval(timerRef.current);
    timerRef.current = setInterval(() => {
      setTimeLeft(tl => {
        if (tl <= 1) { clearInterval(timerRef.current); submit(true); return 0; }
        return tl - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [status, chain.length]); // eslint-disable-line

  // Kelime giriş alanı her yeni kelimede kullanıcı tıklamadan otomatik
  // seçili (odaklı) olsun — bkz. GroupGameView'daki aynı notu.
  useEffect(() => {
    if (status === "playing") wordInputRef.current && wordInputRef.current.focus();
  }, [status, chain.length]);

  function spin() {
    const letters = ALPHABETS[lang].filter(l => lang === "tr" ? l !== "Ğ" : true);
    const pick = letters[Math.floor(Math.random() * letters.length)];
    setLetter(pick);
    setChain([]);
    setFeedback(null);
    setStatus("spinning");
  }

  function flashFeedback(ok, word) {
    setFeedback({ ok, word, key: ++feedbackKeyRef.current });
    if (!ok) { setShake(true); setTimeout(() => setShake(false), 420); }
  }

  async function submit(timedOut) {
    clearInterval(timerRef.current);
    const w = timedOut ? "" : wordInput.trim();
    setWordInput("");

    if (timedOut) {
      // süre yetişmedi: seri burada bozulur, en baştan çark çevirmeye dön
      flashFeedback(false, "");
      setFlash({ ok: false, key: ++feedbackKeyRef.current });
      setTimeout(() => { setStatus("wheel"); setChain([]); }, 1200);
      return;
    }

    if (!w) {
      flashFeedback(false, ""); setFlash({ ok: false, key: ++feedbackKeyRef.current });
      const newChain = [...chain, { word: "", points: 0 }]; setChain(newChain);
      if (newChain.length >= ROUND_WORD_LIMIT) setTimeout(() => { setStatus("wheel"); setChain([]); }, 1200);
      return;
    }

    const isDuplicate = chain.some(c => c.word && normalizeWord(c.word, lang) === normalizeWord(w, lang));
    if (isDuplicate) {
      // aynı kelime bu turda daha önce kullanılmış: oyun burada biter
      flashFeedback(false, w);
      setFlash({ ok: false, key: ++feedbackKeyRef.current });
      setGameOverWord(w);
      return;
    }

    setChecking(true);
    const ok = await checkWordValid(w, lang, required);
    setChecking(false);
    if (ok) await onAddPoints(POINTS_PER_WORD);
    flashFeedback(ok, w);
    setFlash({ ok, key: ++feedbackKeyRef.current });
    const newChain = [...chain, { word: w, points: ok ? POINTS_PER_WORD : 0 }];
    setChain(newChain);
    if (newChain.length >= ROUND_WORD_LIMIT) {
      const allCorrect = newChain.every(c => c.points > 0);
      if (allCorrect) {
        await onAddPoints(STREAK_BONUS);
        setAllCorrectMsg(true);
        setTimeout(() => { setStatus("wheel"); setChain([]); setAllCorrectMsg(false); }, 2200);
      } else {
        setTimeout(() => { setStatus("wheel"); setChain([]); }, 1200);
      }
    }
  }

  return (
    <div className="min-h-screen w-full p-5 flex flex-col items-center" style={{ fontFamily: "Inter, sans-serif" }}>
      <div className="fixed inset-0 -z-10" style={{ background: "radial-gradient(ellipse at 25% 15%, #2d1755 0%, #1c0f38 45%, #0f0a1e 100%)" }} />
      {flash && <FullScreenFlash key={flash.key} ok={flash.ok} onDone={() => setFlash(null)} />}
      <button onClick={onExit} className="absolute top-5 left-5 p-2 rounded-full bg-white/10 text-white"><ArrowLeft size={18} /></button>
      {allCorrectMsg && (
        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-center font-bold text-sm shadow-lg"
          style={{ background: "#f2b705", color: "#1b1030", maxWidth: "88vw" }}>
          🎉 {t.soloAllCorrectMsg}
        </div>
      )}
      <p className="text-white/40 text-xs mt-14 mb-2">{t.solo} · {t.roundOf} {chain.length}{t.of}{ROUND_WORD_LIMIT}</p>

      {gameOverWord && (
        <div className="w-full max-w-sm mt-16 text-center">
          <div className="rounded-3xl p-7" style={{ background: "linear-gradient(160deg,#2c1750,#1b1030)", border: "2px solid #ff6f61" }}>
            <X size={40} color="#ff6f61" className="mx-auto mb-3" />
            <h2 className="text-xl font-bold text-white mb-2" style={{ fontFamily: "Fredoka, sans-serif" }}>{t.duplicateWordTitle}</h2>
            <p className="text-white/80 mb-1"><b className="text-yellow-400">"{gameOverWord}"</b></p>
            <p className="text-white/70 text-sm mb-5">{t.duplicateWordMsg}</p>
            <button onClick={onExit} className="w-full py-2.5 rounded-full font-bold" style={{ background: "#ff6f61", color: "#1b1030" }}>
              {t.backToMenu}
            </button>
          </div>
        </div>
      )}

      {!gameOverWord && status !== "playing" && (
        <div className="flex flex-col items-center mt-4">
          <Wheel lang={lang} spinning={status === "spinning"} resultLetter={letter} excludeFirst={lang === "tr" ? "Ğ" : null}
            onSpinEnd={() => setStatus("playing")} />
          {status === "wheel" && (
            <button onClick={spin} className="mt-8 px-8 py-4 rounded-full font-bold text-lg flex items-center gap-2" style={{ background: "#f2b705", color: "#1b1030", fontFamily: "Fredoka, sans-serif" }}>
              <Play size={20} /> {t.spinWheel}
            </button>
          )}
        </div>
      )}

      {!gameOverWord && status === "playing" && (
        <div className="w-full max-w-sm mt-6">
          <div className="text-center mb-4">
            <p className="text-white text-lg"><b className="text-yellow-400 text-2xl">{required}</b> {t.writeWordStartingWith}</p>
          </div>
          <div className="flex items-center justify-center gap-1 text-sm mb-2" style={{ color: timeLeft <= 5 ? "#ff6f61" : "rgba(255,255,255,0.6)" }}>
            <Clock size={14} /> {timeLeft}s
          </div>
          <div className="flex gap-2 mb-4">
            <input ref={wordInputRef} autoFocus value={wordInput}
              onChange={e => {
                const v = e.target.value;
                if (v.includes("\n")) { submit(false); return; }
                setWordInput(v);
              }}
              onKeyDown={e => e.key === "Enter" && submit(false)}
              enterKeyHint="send" inputMode="text"
              disabled={checking} className="flex-1 px-4 py-3 rounded-full bg-white/10 text-white outline-none border-2 border-yellow-400/40"
              style={{ animation: shake ? "inputShake 420ms ease" : "none" }} />
            <button onClick={() => submit(false)} disabled={checking} className="px-5 py-3 rounded-full font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>
              {checking ? t.checking : t.submit}
            </button>
          </div>
          <div className="mb-2 min-h-[44px] flex items-center justify-center">
            <WordFeedbackBadge feedback={feedback} t={t} />
          </div>
          <div className="mt-4 flex flex-wrap gap-1 justify-center">
            {chain.slice(-10).map((c, i) => (
              <span key={i} className={`px-2 py-1 rounded-full text-xs ${c.points > 0 ? "bg-green-500/20 text-green-300" : "bg-red-500/20 text-red-300"}`}>{c.word || "—"}</span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// Guards against a fully black/blank screen: if anything inside the app
// throws while rendering (e.g. right when entering a group), this catches
// it and shows a recoverable screen instead of a black page.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, err: null }; }
  static getDerivedStateFromError(err) { return { hasError: true, err }; }
  componentDidCatch(err, info) { console.error("App crashed:", err, info); }
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen w-full flex flex-col items-center justify-center p-6 text-center" style={{ background: "#0f0a1e" }}>
          <p className="text-white font-bold mb-4">Bir şeyler ters gitti. Devam etmek için sayfayı yenile.</p>
          {this.state.err && (
            <pre className="text-red-300 text-xs text-left max-w-lg overflow-auto mb-4 p-3 rounded-lg bg-white/5" style={{ whiteSpace: "pre-wrap" }}>
              {String(this.state.err && (this.state.err.stack || this.state.err.message || this.state.err))}
            </pre>
          )}
          <button onClick={() => window.location.reload()} className="px-6 py-3 rounded-full font-bold" style={{ background: "#f2b705", color: "#1b1030" }}>
            Sayfayı Yenile
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
